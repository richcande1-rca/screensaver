

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Ambient Aquarium Prototype</title>
<style>
:root{
  --bg:#05070b;
  --tank-w:min(62vw, 560px);
  --tank-h:min(86vh, 920px);

  --water-top:#18485f;
  --water-mid:#103547;
  --water-bottom:#08141d;

  --glass-border:rgba(255,255,255,0.12);
  --glass-highlight:rgba(255,255,255,0.08);
  --glass-shadow:rgba(0,0,0,0.45);

  --beam-a:rgba(255,255,255,0.13);
  --beam-b:rgba(255,255,255,0.00);
  --beam-rgb:255,255,255;
  --beam-alpha-hi:.13;
  --beam-alpha-lo:0;
  --light-intensity:1;
  --wheel-speed:10s;
  --wheel-play:running;
  --shimmer-base:.34;

  --tank-glow:rgba(90,170,220,0.20);
  --ui-bg:rgba(10,14,18,0.72);
  --ui-border:rgba(255,255,255,0.10);
  --ui-text:#d8e7ef;

  --particle:rgba(230,245,255,0.18);
  --bubble:rgba(230,247,255,0.45);

  --fish-glow:drop-shadow(0 0 8px rgba(120,220,255,0.15));

  --mode-sat:1;
  --mode-bright:1;
  --mode-contrast:1;
  --mode-hue:0deg;
  --mode-overlay:rgba(0,0,0,0);

  --photo-blur:0px;
  --diver-blur:.12px;
  --shimmer-opacity:.34;
  --ripple-display:block;
  --ripple-opacity:.14;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  height:100%;
  background:
    radial-gradient(circle at 50% 45%, rgba(20,35,55,0.22), transparent 40%),
    radial-gradient(circle at 50% 50%, rgba(0,0,0,0.15), transparent 50%),
    linear-gradient(180deg, #05070b 0%, #020305 100%);
  overflow:hidden;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  color:var(--ui-text);
}

body{
  display:grid;
  place-items:center;
}

.stage{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
}

.room-vignette{
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(circle at 50% 50%, transparent 18%, rgba(0,0,0,0.10) 55%, rgba(0,0,0,0.60) 100%),
    radial-gradient(circle at 50% 50%, rgba(80,170,210,0.06), transparent 24%);
}

.tank-wrap{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:var(--tank-w);
  height:var(--tank-h);
  display:flex;
  align-items:center;
  justify-content:center;
  filter:
    drop-shadow(0 18px 50px rgba(0,0,0,0.55))
    drop-shadow(0 0 35px var(--tank-glow));
}

.tank{
  position:relative;
  width:100%;
  height:100%;
  overflow:hidden;
  border-radius:26px;
  border:1px solid var(--glass-border);
  background:
    linear-gradient(180deg,
      color-mix(in srgb, var(--water-top) 94%, white 6%) 0%,
      var(--water-mid) 38%,
      var(--water-bottom) 100%);
  box-shadow:
    inset 0 1px 0 var(--glass-highlight),
    inset 0 -30px 80px rgba(0,0,0,0.25),
    inset 24px 0 50px rgba(0,0,0,0.12),
    inset -24px 0 50px rgba(0,0,0,0.12),
    0 18px 40px var(--glass-shadow);
  isolation:isolate;
  filter:
    saturate(var(--mode-sat))
    brightness(var(--mode-bright))
    contrast(var(--mode-contrast))
    hue-rotate(var(--mode-hue));
}

.tank::before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(90deg,
      rgba(255,255,255,0.06) 0%,
      rgba(255,255,255,0.015) 8%,
      transparent 18%,
      transparent 82%,
      rgba(255,255,255,0.015) 92%,
      rgba(255,255,255,0.055) 100%);
  mix-blend-mode:screen;
  z-index:50;
}

.tank::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:var(--mode-overlay);
  z-index:49;
}

.layer{
  position:absolute;
  inset:0;
  pointer-events:none;
}

.photo-bg{
  z-index:1;
  background:
    linear-gradient(180deg, rgba(0,0,0,0.10), rgba(0,0,0,0.24)),
    url("./aquarium-bg.png") center center / cover no-repeat;
  filter:
    saturate(.92)
    brightness(.78)
    contrast(1.02)
    blur(var(--photo-blur));
  transform:scale(1.03);
  opacity:.92;
}

.back-haze{
  z-index:2;
  background:
    radial-gradient(circle at 50% 35%, rgba(160,220,255,0.09), transparent 26%),
    radial-gradient(circle at 26% 48%, rgba(120,220,180,0.05), transparent 22%),
    radial-gradient(circle at 75% 55%, rgba(120,220,180,0.04), transparent 26%);
  opacity:.9;
  animation:hazeDrift 18s ease-in-out infinite alternate;
}

.light-beams{
  z-index:3;
  overflow:hidden;
  mix-blend-mode:screen;
  opacity:.95;
}

.beam{
  position:absolute;
  top:-10%;
  width:18%;
  height:70%;
  background:linear-gradient(
    180deg,
    rgba(var(--beam-rgb), calc(var(--beam-alpha-hi) * var(--light-intensity))),
    rgba(var(--beam-rgb), calc(var(--beam-alpha-lo) * var(--light-intensity)))
  );
  filter:blur(var(--beam-blur, 8px));
  transform-origin:top center;
  opacity:.86;
  animation:beamSway 10s ease-in-out infinite alternate;
}

.beam.b1{ left:20%; transform:rotate(-10deg); animation-duration:13s; }
.beam.b2{ left:39%; transform:rotate(-3deg); animation-duration:11s; opacity:.55; }
.beam.b3{ left:56%; transform:rotate(7deg); animation-duration:15s; opacity:.48; }

.light-shimmer{
  z-index:4;
  left:0;
  top:0;
  width:100%;
  height:44%;
  opacity:calc(var(--shimmer-base) * var(--light-intensity));
  mix-blend-mode:screen;
  overflow:hidden;
  -webkit-mask-image:linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,.95) 38%, rgba(0,0,0,.45) 72%, rgba(0,0,0,0) 100%);
  mask-image:linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,.95) 38%, rgba(0,0,0,.45) 72%, rgba(0,0,0,0) 100%);
}

.light-shimmer::before{
  content:"";
  position:absolute;
  inset:-8% -20%;
  background:
    repeating-linear-gradient(
      103deg,
      rgba(255,255,255,0.00) 0px,
      rgba(255,255,255,0.00) 18px,
      rgba(255,255,255,0.20) 28px,
      rgba(255,255,255,0.08) 38px,
      rgba(255,255,255,0.00) 54px,
      rgba(255,255,255,0.00) 78px
    ),
    repeating-linear-gradient(
      79deg,
      rgba(180,220,255,0.00) 0px,
      rgba(180,220,255,0.12) 16px,
      rgba(180,220,255,0.00) 34px,
      rgba(255,255,255,0.10) 48px,
      rgba(255,255,255,0.00) 72px
    );
  filter:blur(var(--shimmer-blur, 1.5px));
  transform:translateX(0) translateY(0) scale(1.04);
  animation:topShimmerMove 4.8s linear infinite;
}

.wheel-spectrum{
  z-index:5;
  opacity:0;
  overflow:hidden;
  mix-blend-mode:screen;
  transition:opacity .35s ease;
  -webkit-mask-image:linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,.96) 38%, rgba(0,0,0,.52) 72%, rgba(0,0,0,0) 100%);
  mask-image:linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,.96) 38%, rgba(0,0,0,.52) 72%, rgba(0,0,0,0) 100%);
}

.wheel-spectrum::before{
  content:"";
  position:absolute;
  inset:-34% -30% -22% -30%;
  border-radius:50%;
  background:conic-gradient(
    from 0deg,
    rgba(255,82,112,0.00) 0deg,
    rgba(255,82,112,0.95) 38deg,
    rgba(255,176,74,0.95) 82deg,
    rgba(255,233,96,0.92) 122deg,
    rgba(98,255,168,0.90) 170deg,
    rgba(82,235,255,0.90) 220deg,
    rgba(100,132,255,0.92) 270deg,
    rgba(214,96,255,0.94) 322deg,
    rgba(255,82,112,0.95) 360deg
  );
  filter:blur(var(--wheel-core-blur, 46px)) saturate(1.15) brightness(1.06);
  transform-origin:50% 42%;
  animation:wheelSpin var(--wheel-speed) linear infinite;
  animation-play-state:var(--wheel-play);
}

.wheel-spectrum::after{
  content:"";
  position:absolute;
  inset:-2% -28% 32% -28%;
  background:linear-gradient(
    90deg,
    rgba(255,92,120,0.00) 0%,
    rgba(255,92,120,0.38) 12%,
    rgba(255,182,86,0.36) 24%,
    rgba(255,239,110,0.34) 36%,
    rgba(98,255,170,0.34) 50%,
    rgba(86,232,255,0.34) 64%,
    rgba(110,136,255,0.36) 78%,
    rgba(220,100,255,0.38) 90%,
    rgba(255,92,120,0.00) 100%
  );
  background-size:220% 100%;
  filter:blur(var(--wheel-sweep-blur, 20px)) saturate(1.12) brightness(1.05);
  animation:wheelSweep var(--wheel-sweep-speed) linear infinite;
  animation-play-state:var(--wheel-play);
}

.tank.light-wheel .wheel-spectrum{
  opacity:calc(.72 * var(--light-intensity));
}

.tank.light-wheel .light-beams{
  opacity:1;
}

.tank.light-wheel .light-shimmer{
  opacity:calc((var(--shimmer-base) + .10) * var(--light-intensity));
}

.tank.light-wheel .beam.b1{ left:15%; }
.tank.light-wheel .beam.b2{ left:39%; }
.tank.light-wheel .beam.b3{ left:63%; }

.diver-layer{
  z-index:6;
  pointer-events:none;
}

.diver-ornament{
  position:absolute;
  left:53%;
  bottom:4.6%;
  width:12.4%;
  max-width:70px;
  opacity:.90;
  filter:
    saturate(.88)
    brightness(.93)
    contrast(1.12)
    blur(var(--diver-blur))
    drop-shadow(0 2px 6px rgba(0,0,0,0.24))
    drop-shadow(0 0 4px rgba(190,220,235,0.10));
  transform:translateX(-50%);
  transform-origin:50% 85%;
}

.diver-fade{
  z-index:7;
  pointer-events:none;
  background:
    radial-gradient(
      circle at 53% 84%,
      rgba(70,150,210,0.00) 0%,
      rgba(70,150,210,0.00) 6%,
      rgba(70,150,210,0.06) 12%,
      rgba(40,110,180,0.10) 18%,
      rgba(20,60,120,0.06) 26%,
      rgba(0,0,0,0.00) 38%
    );
  mix-blend-mode:screen;
  opacity:.26;
  filter:blur(4px);
}

.particles,
.bubbles,
.fish-layer{
  z-index:9;
}

.fish-back-layer{
  z-index:5;
}

.crab-layer{
  z-index:8;
  overflow:hidden;
}

.crab{
  position:absolute;
  left:0;
  top:0;
  width:clamp(52px, 6.8vw, 96px);
  opacity:.98;
  will-change:transform, opacity;
  transform:translate3d(0,0,0);
  transform-origin:50% 100%;
  backface-visibility:hidden;
  filter:
    drop-shadow(0 2px 5px rgba(0,0,0,0.28))
    drop-shadow(0 0 4px rgba(0,0,0,0.12));
}

.foreground-plants{
  z-index:16;
  overflow:hidden;
}

.fg-plant{
  position:absolute;
  bottom:-6.5%;
  width:12%;
  transform-origin:50% 100%;
  opacity:.44;
  filter:none;
  animation:fgPlantSway 8s ease-in-out infinite alternate;
}

.fg-plant img{
  display:block;
  width:100%;
  height:auto;
  pointer-events:none;
  user-select:none;
  -webkit-user-drag:none;
}

.fg1{
  left:4%;
  width:22%;
  bottom:-7.8%;
  animation-duration:9.2s;
  animation-delay:-1.8s;
  opacity:.50;
}

.fg2{
  left:33%;
  width:24%;
  bottom:-16.2%;
  animation-duration:8.4s;
  animation-delay:-2.6s;
  opacity:.60;
}

.fg4{
  left:54%;
  width:29%;
  bottom:-10.8%;
  animation-duration:7.9s;
  animation-delay:-1.1s;
  opacity:1;
  z-index:8;
  filter:drop-shadow(0 2px 6px rgba(0,0,0,0.22));
}

.fg3{
  right:-2%;
  width:24%;
  bottom:-9.2%;
  animation-duration:10.1s;
  animation-delay:-3.3s;
  opacity:.48;
}

.hero-plant{
  z-index:2;
}

.mid-plant{
  z-index:3;
}

.accent-plant{
  z-index:4;
}

.right-plant{
  z-index:2;
}

.ripple{
  z-index:20;
  display:var(--ripple-display);
  opacity:var(--ripple-opacity);
  mix-blend-mode:screen;
  background:
    repeating-linear-gradient(
      100deg,
      rgba(255,255,255,0.18) 0px,
      rgba(255,255,255,0.06) 6px,
      rgba(255,255,255,0.00) 20px,
      rgba(255,255,255,0.05) 34px,
      rgba(255,255,255,0.00) 54px
    );
  filter:blur(8px);
  animation:rippleShift 11s linear infinite;
}

.glass-reflection{
  z-index:30;
  background:
    linear-gradient(112deg,
      transparent 0%,
      transparent 58%,
      rgba(255,255,255,0.06) 66%,
      rgba(255,255,255,0.00) 74%,
      transparent 82%);
  opacity:.75;
}

.particle{
  position:absolute;
  width:4px;
  height:4px;
  border-radius:50%;
  background:var(--particle);
  filter:blur(.2px);
  will-change:transform, opacity;
  transform:translate3d(0,0,0);
  backface-visibility:hidden;
}

.bubble{
  position:absolute;
  width:10px;
  height:10px;
  border-radius:50%;
  border:1.4px solid rgba(255,255,255,0.58);
  background:radial-gradient(circle at 34% 32%, rgba(255,255,255,0.82), rgba(210,242,255,0.20) 44%, rgba(255,255,255,0.06) 62%, transparent 72%);
  box-shadow:inset -1px -1px 4px rgba(255,255,255,0.30), 0 0 8px rgba(210,242,255,0.22);
  opacity:.7;
  will-change:transform, opacity;
  transform:translate3d(0,0,0);
  backface-visibility:hidden;
}

.fish{
  position:absolute;
  will-change:transform;
  transform:translate3d(0,0,0);
  backface-visibility:hidden;
  filter:var(--fish-filter, var(--fish-glow));
}

.fish-sprite{
  position:absolute;
  display:block;
  width:100%;
  height:100%;
  object-fit:contain;
  pointer-events:none;
  user-select:none;
  -webkit-user-drag:none;
  image-rendering:auto;
  background:transparent;
  filter:var(--fish-sprite-filter, drop-shadow(0 0 8px rgba(120,220,255,0.10)));
}

.tetra{
  width:52px;
  height:28px;
}

.angel{
  width:92px;
  height:128px;
}

.discus{
  width:74px;
  height:74px;
}

.barb{
  width:60px;
  height:34px;
}

.controls{
  position:fixed;
  left:50%;
  bottom:calc(12px + env(safe-area-inset-bottom, 0px));
  transform:translateX(-50%);
  z-index:1000;
  display:flex;
  flex-direction:column;
  gap:8px;
  align-items:stretch;
  justify-content:center;
  padding:10px;
  min-width:min(92vw, 720px);
  border:1px solid var(--ui-border);
  border-radius:18px;
  background:var(--ui-bg);
  backdrop-filter:blur(var(--controls-blur, 8px));
  box-shadow:0 10px 30px rgba(0,0,0,0.35);
  pointer-events:auto;
  transition:opacity .22s ease, transform .22s ease;
}

.controlsToggle{
  position:fixed;
  right:max(12px, env(safe-area-inset-right, 0px));
  bottom:calc(12px + env(safe-area-inset-bottom, 0px));
  z-index:1002;
  appearance:none;
  border:1px solid rgba(191,230,255,0.24);
  background:rgba(10,14,18,0.72);
  color:var(--ui-text);
  padding:10px 14px;
  border-radius:999px;
  font-size:12px;
  font-weight:700;
  letter-spacing:.08em;
  text-transform:uppercase;
  backdrop-filter:blur(var(--controls-blur, 8px));
  box-shadow:0 8px 24px rgba(0,0,0,0.28);
  cursor:pointer;
  touch-action:manipulation;
  transition:background .18s ease, transform .18s ease, border-color .18s ease, opacity .18s ease;
}

.controlsToggle:hover{
  background:rgba(22,28,38,0.88);
  transform:translateY(-1px);
}

.controlsToggle.is-open{
  background:rgba(120,210,255,0.16);
  border-color:rgba(150,230,255,0.28);
}

body.controls-collapsed .controls{
  opacity:0;
  pointer-events:none;
  transform:translateX(-50%) translateY(12px);
}

.control-row{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  align-items:center;
  justify-content:center;
}

.controls button{
  appearance:none;
  border:1px solid rgba(255,255,255,0.11);
  background:rgba(255,255,255,0.06);
  color:var(--ui-text);
  padding:8px 12px;
  border-radius:12px;
  font-size:13px;
  cursor:pointer;
  transition:.18s ease;
  touch-action:manipulation;
}

.controls button:hover{
  background:rgba(255,255,255,0.11);
  transform:translateY(-1px);
}

.controls button.active{
  background:rgba(120,210,255,0.16);
  border-color:rgba(150,230,255,0.25);
  box-shadow:0 0 0 1px rgba(150,230,255,0.08) inset;
}

.sliderWrap,
.wheelWrap{
  display:flex;
  align-items:center;
  gap:8px;
  padding:6px 10px;
  border:1px solid rgba(255,255,255,0.10);
  border-radius:12px;
  background:rgba(255,255,255,0.04);
  min-height:38px;
}

.sliderWrap span,
.wheelWrap span{
  font-size:12px;
  letter-spacing:.03em;
  color:rgba(225,240,248,0.82);
  white-space:nowrap;
}

#lightIntensity{
  width:min(220px, 42vw);
  accent-color:rgb(140, 220, 255);
}

#lightIntensityValue{
  min-width:42px;
  text-align:right;
  font-variant-numeric:tabular-nums;
  color:rgba(225,240,248,0.78);
}

#cycleSpeed{
  width:min(150px, 28vw);
  accent-color:rgb(255, 168, 214);
}

#cycleSpeedValue{
  min-width:42px;
  text-align:right;
  font-variant-numeric:tabular-nums;
  color:rgba(225,240,248,0.78);
}

.wheelBadge{
  inline-size:24px;
  block-size:24px;
  border-radius:999px;
  display:grid;
  place-items:center;
  border:1px solid rgba(255,255,255,0.18);
  background:rgba(255,255,255,0.04);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,0.03);
  overflow:hidden;
  flex:0 0 auto;
}

.wheelDisc{
  inline-size:18px;
  block-size:18px;
  border-radius:999px;
  background:conic-gradient(
    #ff4d66 0deg,
    #ffb347 55deg,
    #ffe84d 100deg,
    #52ff94 150deg,
    #45e7ff 210deg,
    #6f79ff 265deg,
    #db5bff 320deg,
    #ff4d66 360deg
  );
  filter:saturate(1.08) brightness(1.05);
  animation:wheelSpin var(--wheel-speed) linear infinite;
  animation-play-state:var(--wheel-play);
}

.title{
  position:fixed;
  top:max(12px, env(safe-area-inset-top, 0px));
  left:50%;
  transform:translateX(-50%);
  z-index:1000;
  font-size:14px;
  font-weight:700;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:#dff6ff;
  background:linear-gradient(180deg, rgba(170,235,255,0.16), rgba(8,12,18,0.46));
  padding:8px 12px;
  border-radius:999px;
  border:1px solid rgba(191,230,255,0.50);
  backdrop-filter:blur(var(--title-blur, 6px));
  -webkit-text-stroke:.85px rgba(191,230,255,0.78);
  paint-order:stroke fill;
  text-shadow:
    0 0 2px rgba(255,255,255,0.92),
    0 0 8px rgba(191,230,255,0.96),
    0 0 18px rgba(191,230,255,0.68),
    0 0 34px rgba(191,230,255,0.32);
  box-shadow:
    0 0 14px rgba(191,230,255,0.24),
    0 0 34px rgba(191,230,255,0.14),
    inset 0 0 12px rgba(191,230,255,0.12);
  transition:
    color 220ms linear,
    border-color 220ms linear,
    text-shadow 220ms linear,
    box-shadow 220ms linear,
    background 220ms linear,
    -webkit-text-stroke-color 220ms linear;
}

@keyframes beamSway{
  from{ transform:translateY(0) rotate(-8deg); }
  to{ transform:translateY(1.5%) rotate(-4deg); }
}

@keyframes hazeDrift{
  from{ transform:translateX(-1.2%) translateY(-0.5%); }
  to{ transform:translateX(1.2%) translateY(0.8%); }
}

@keyframes rippleShift{
  from{ transform:translateX(-4%) translateY(-1%) scale(1.02); }
  to{ transform:translateX(4%) translateY(1%) scale(1.04); }
}

@keyframes topShimmerMove{
  0%{
    transform:translateX(-8%) translateY(0%) scale(1.04);
  }
  50%{
    transform:translateX(2%) translateY(1.2%) scale(1.07);
  }

  function getBubbleAudioTargetVolume() {
    const density = clamp(bubbleIntensityScale, 0, 1);
    const base = clamp(0.10 + density * 0.22, 0.06, 0.32);
    return clamp(base * bubbleVolumeScale, 0, 1);
  }

  function ensureBubbleAudioObject() {
    if (bubbleAudio) return bubbleAudio;
    bubbleAudio = new Audio(BUBBLE_AUDIO_SRC);
    bubbleAudio.loop = true;
    bubbleAudio.preload = 'auto';
    bubbleAudio.playsInline = true;
    bubbleAudio.volume = getBubbleAudioTargetVolume();
    return bubbleAudio;
  }

  function applyBubbleIntensity(value) {
    const n = clamp(Number(value) || 0, 0, 100);
    bubbleIntensityScale = n / 100;
    if (bubbleIntensityValue) bubbleIntensityValue.textContent = `${Math.round(n)}%`;
    if (bubbleAudio) bubbleAudio.volume = getBubbleAudioTargetVolume();
  }

  function applyBubbleVolume(value) {
    const n = clamp(Number(value) || 0, 0, 100);
    bubbleVolumeScale = n / 100;
    if (bubbleVolumeValue) bubbleVolumeValue.textContent = `${Math.round(n)}%`;
    try {
      localStorage.setItem(BUBBLE_VOLUME_STORAGE_KEY, String(Math.round(n)));
    } catch (err) {}
    if (bubbleAudio) bubbleAudio.volume = getBubbleAudioTargetVolume();
  }

  function setBubbleSoundButtonUI(enabled) {
    if (!bubbleSoundBtn) return;
    bubbleSoundBtn.classList.toggle('active', enabled);
    bubbleSoundBtn.setAttribute('aria-pressed', String(enabled));
    bubbleSoundBtn.textContent = enabled ? 'Bubble Sound: On' : 'Bubble Sound: Off';
  }

  async function syncBubbleAudioPlayback() {
    const audio = ensureBubbleAudioObject();
    audio.volume = getBubbleAudioTargetVolume();

    if (!bubbleSoundEnabled || document.hidden) {
      audio.pause();
      return false;
    }

    try {
      await audio.play();
      bubbleSoundPrimed = true;
      return true;
    } catch (err) {
      bubbleSoundPrimed = false;
      return false;
    }
  }

  function setBubbleSoundEnabled(enabled) {
    bubbleSoundEnabled = !!enabled;
    setBubbleSoundButtonUI(bubbleSoundEnabled);
    try {
      localStorage.setItem(BUBBLE_SOUND_STORAGE_KEY, bubbleSoundEnabled ? '1' : '0');
    } catch (err) {}

    const audio = ensureBubbleAudioObject();
    audio.volume = getBubbleAudioTargetVolume();

    if (!bubbleSoundEnabled) {
      audio.pause();
      audio.currentTime = 0;
      nextBubbleSoundAt = 0;
      return;
    }

    void syncBubbleAudioPlayback();
  }

  async function ensureBubbleAudio() {
    ensureBubbleAudioObject();
    if (!bubbleSoundEnabled || document.hidden) return true;
    return await syncBubbleAudioPlayback();
  }

  function triggerBubblePopCluster() {}

  function scheduleBubbleAudio() {}

  function getFullscreenElement() {
    return document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement || null;
  }

  async function enterFullscreen() {
    const el = stage || document.documentElement;
    try {
      if (el.requestFullscreen) return await el.requestFullscreen();
      if (el.webkitRequestFullscreen) return el.webkitRequestFullscreen();
      if (el.msRequestFullscreen) return el.msRequestFullscreen();
    } catch (err) {}
  }

  async function exitFullscreen() {
    try {
      if (document.exitFullscreen) return await document.exitFullscreen();
      if (document.webkitExitFullscreen) return document.webkitExitFullscreen();
      if (document.msExitFullscreen) return document.msExitFullscreen();
    } catch (err) {}
  }

  function syncFullscreenUI() {
    const active = !!getFullscreenElement();
    if (fullscreenBtn) {
      fullscreenBtn.classList.toggle('active', active);
      fullscreenBtn.setAttribute('aria-pressed', String(active));
      fullscreenBtn.textContent = active ? 'Exit Fullscreen' : 'Fullscreen';
    }
    requestAnimationFrame(refreshTankRect);
    setTimeout(refreshTankRect, 120);
  }

  if (controlsToggle) {
    controlsToggle.addEventListener('click', () => {
      const open = document.body.classList.contains('controls-collapsed');
      setControlsOpen(open);
    });
  }

  if (fullscreenBtn) {
    fullscreenBtn.addEventListener('click', async () => {
      await ensureBubbleAudio();
      if (getFullscreenElement()) await exitFullscreen();
      else await enterFullscreen();
      syncFullscreenUI();
    });
  }

  if (bubbleSoundBtn) {
    bubbleSoundBtn.addEventListener('click', async () => {
      const next = !bubbleSoundEnabled;
      setBubbleSoundEnabled(next);
      if (next) {
        const ready = await ensureBubbleAudio();
        if (ready) {
          triggerBubblePopCluster(audioCtx.currentTime + 0.02, Math.max(0.45, bubbleIntensityScale));
          nextBubbleSoundAt = performance.now() + 90;
        }
      }
    });
  }

  document.addEventListener('fullscreenchange', syncFullscreenUI);
  document.addEventListener('webkitfullscreenchange', syncFullscreenUI);
  document.addEventListener('msfullscreenchange', syncFullscreenUI);

  document.addEventListener('visibilitychange', async () => {
    if (document.hidden) {
      if (bubbleAudio) bubbleAudio.pause();
      return;
    }
    if (bubbleSoundEnabled) {
      await ensureBubbleAudio();
    }
  });

  const primeBubbleAudioFromGesture = async () => {
    if (!bubbleSoundEnabled) return;
    await ensureBubbleAudio();
  };

  window.addEventListener('pointerdown', primeBubbleAudioFromGesture, { passive:true });
  window.addEventListener('touchstart', primeBubbleAudioFromGesture, { passive:true });

  let currentMode = 'day';
  let cyclePhase = 0;
  let swimSpeedScale = 1;
  let bubbleIntensityScale = 1;
  let bubbleVolumeScale = 1;
  let bubbleSoundEnabled = false;
  let bubbleAudio = null;
  let bubbleSoundPrimed = false;
  let nextBubbleSoundAt = 0;

  function hslToRgb(h, s, l) {
    const hue = ((h % 360) + 360) % 360;
    const sat = clamp(s, 0, 100) / 100;
    const light = clamp(l, 0, 100) / 100;

    const c = (1 - Math.abs(2 * light - 1)) * sat;
    const x = c * (1 - Math.abs(((hue / 60) % 2) - 1));
    const m = light - c / 2;

    let r1 = 0, g1 = 0, b1 = 0;

    if (hue < 60) [r1, g1, b1] = [c, x, 0];
    else if (hue < 120) [r1, g1, b1] = [x, c, 0];
    else if (hue < 180) [r1, g1, b1] = [0, c, x];
    else if (hue < 240) [r1, g1, b1] = [0, x, c];
    else if (hue < 300) [r1, g1, b1] = [x, 0, c];
    else [r1, g1, b1] = [c, 0, x];

    return [
      Math.round((r1 + m) * 255),
      Math.round((g1 + m) * 255),
      Math.round((b1 + m) * 255)
    ];
  }

  function applyCyclePalette(timeMs) {
    const speed = FIXED_CYCLE_SPEED;

    if (speed > 0) {
      const duration = 34 - (speed / 100) * 28;
      cyclePhase = ((timeMs * 0.001) / duration) % 1;
    }

    const hue = (205 + cyclePhase * 360) % 360;
    const [topR, topG, topB] = hslToRgb(hue, 48, 21);
    const [midR, midG, midB] = hslToRgb(hue + 10, 42, 14);
    const [bottomR, bottomG, bottomB] = hslToRgb(hue + 20, 45, 7);
    const [beamR, beamG, beamB] = hslToRgb(hue + 26, 92, 72);
    const [overlayR, overlayG, overlayB] = hslToRgb(hue + 8, 58, 24);

    const r = rootEl.style;
    r.setProperty('--water-top', `rgb(${topR},${topG},${topB})`);
    r.setProperty('--water-mid', `rgb(${midR},${midG},${midB})`);
    r.setProperty('--water-bottom', `rgb(${bottomR},${bottomG},${bottomB})`);
    r.setProperty('--beam-rgb', `${beamR},${beamG},${beamB}`);
    r.setProperty('--beam-alpha-hi', '.17');
    r.setProperty('--beam-alpha-lo', '0');
    r.setProperty('--shimmer-base', '.33');
    r.setProperty('--mode-sat', '1.08');
    r.setProperty('--mode-bright', '.99');
    r.setProperty('--mode-contrast', '1.07');
    r.setProperty('--mode-hue', '0deg');
    r.setProperty('--mode-overlay', `linear-gradient(180deg, rgba(${overlayR},${overlayG},${overlayB},0.08), rgba(${bottomR},${bottomG},${bottomB},0.14))`);
    setPresetBeam(beamR, beamG, beamB);
  }

  function makeEl(html) {
    const wrap = document.createElement('div');
    wrap.innerHTML = html.trim();
    return wrap.firstChild;
  }

  function chooseTargetForFish(f) {
    if (f.type === 'angel') {
      const cx = f.homeX ?? 0.50;
      const cy = f.homeY ?? 0.18;
      const spreadX = isMobile ? 0.34 : 0.40;
      const spreadY = isMobile ? 0.09 : 0.11;
      f.targetX = clamp(cx + rand(-spreadX, spreadX), 0.06, 0.94);
      f.targetY = clamp(cy + rand(-spreadY, spreadY), 0.05, 0.31);
    } else if (f.type === 'tetra') {
      const cx = f.homeX ?? 0.50;
      const cy = f.homeY ?? 0.58;
      const spreadX = isMobile ? 0.24 : 0.31;
      const spreadY = isMobile ? 0.10 : 0.13;
      const dipToBottom = Math.random() < 0.16;

      f.targetX = clamp(cx + rand(-spreadX, spreadX), 0.06, 0.94);

      if (dipToBottom) {
        f.targetY = rand(0.70, 0.82);
      } else {
        f.targetY = clamp(cy + rand(-spreadY, spreadY), 0.36, 0.74);
      }
    } else if (f.type === 'discus') {
      const cruiseBandRoll = Math.random();
      f.targetX = rand(0.08, 0.92);

      if (cruiseBandRoll < 0.24) {
        f.targetY = rand(0.12, 0.34);
      } else if (cruiseBandRoll < 0.68) {
        f.targetY = rand(0.34, 0.68);
      } else {
        f.targetY = rand(0.68, 0.86);
      }
    } else if (f.type === 'barb') {
      const cx = f.homeX ?? 0.50;
      const cy = f.homeY ?? 0.66;
      const spreadX = isMobile ? 0.38 : 0.46;
      const spreadY = isMobile ? 0.14 : 0.18;
      const bottomRun = Math.random() < 0.28;

      f.targetX = clamp(cx + rand(-spreadX, spreadX), 0.05, 0.95);

      if (bottomRun) {
        f.targetY = rand(0.74, 0.89);
      } else {
        f.targetY = clamp(cy + rand(-spreadY, spreadY), 0.50, 0.86);
      }
    }
  }

  function pickState(f, force) {
    if (f.type === 'discus') {
      if (force === 'idle' || force === 'cruise') {
        f.state = force;
      } else {
        f.state = Math.random() < 0.26 ? 'idle' : 'cruise';
      }

      if (f.state === 'idle') {
        f.stateTimer = rand(2.8, 5.0);
      } else {
        f.state = 'cruise';
        f.stateTimer = rand(7.0, 12.5);
        chooseTargetForFish(f);
      }
      return;
    }

    if (force) {
      f.state = force;
    } else {
      const r = Math.random();
      if (f.type === 'tetra') {
        if (r < 0.18) f.state = 'idle';
        else if (r < 0.92) f.state = 'cruise';
        else if (r < 0.985) f.state = 'turn';
        else f.state = 'dart';
      } else if (f.type === 'angel') {
        if (r < 0.30) f.state = 'idle';
        else if (r < 0.93) f.state = 'cruise';
        else if (r < 0.99) f.state = 'turn';
        else f.state = 'dart';
      } else if (f.type === 'barb') {
        if (r < 0.20) f.state = 'idle';
        else if (r < 0.91) f.state = 'cruise';
        else if (r < 0.985) f.state = 'turn';
        else f.state = 'dart';
      }
    }

    if (f.state === 'idle') {
      f.stateTimer = rand(2.4, 5.8);
    } else if (f.state === 'cruise') {
      f.stateTimer = rand(3.8, 8.5);
      chooseTargetForFish(f);
    } else if (f.state === 'turn') {
      f.stateTimer = rand(0.9, 2.1);
      chooseTargetForFish(f);
    } else if (f.state === 'dart') {
      f.stateTimer = rand(0.28, 0.62);
      chooseTargetForFish(f);
      f.targetX += rand(-0.08, 0.08);
      f.targetY += rand(-0.06, 0.06);
    }
  }

  function chooseNewCrabGoal() {
    if (!crab) return;

    const zone = crab.maxX - crab.minX;
    const leftBuffer = crab.minX + zone * 0.16;
    const rightBuffer = crab.maxX - zone * 0.16;

    let dir;
    if (crab.x <= leftBuffer) {
      dir = 1;
    } else if (crab.x >= rightBuffer) {
      dir = -1;
    } else if (Math.random() < 0.58) {
      dir = crab.dir || (Math.random() < 0.5 ? -1 : 1);
    } else {
      dir = Math.random() < 0.5 ? -1 : 1;
    }

    const step = rand(zone * 0.05, zone * 0.16);
    crab.targetX = clamp(crab.x + dir * step, crab.minX, crab.maxX);

    if (Math.abs(crab.targetX - crab.x) < zone * 0.03) {
      crab.targetX = clamp(crab.x + dir * zone * 0.08, crab.minX, crab.maxX);
    }

    crab.dir = crab.targetX >= crab.x ? 1 : -1;
    crab.currentSpeed = rand(crab.speedMin, crab.speedMax);
    crab.pause = 0;
    crab.pauseAfterMove = rand(0.35, 1.05);
  }

  let last = performance.now();

  function animate(now) {
    const rawDt = now - last;
    last = now;

    frameAvg = lerp(frameAvg, rawDt, 0.08);

    if (!isMobile) {
      const underLoad = rawDt > 24 || frameAvg > 22.5;
      if (underLoad) {
        lowPerfMs += rawDt;
        goodPerfMs = 0;
      } else {
        goodPerfMs += rawDt;
        lowPerfMs = Math.max(0, lowPerfMs - rawDt * 0.5);
      }

      if (!perfLite && lowPerfMs > 1200) setPerfLite(true);
      if (perfLite && goodPerfMs > 2400 && frameAvg < 19.5) setPerfLite(false);
    }

    const dt = Math.min(110, rawDt);
    const dtSec = dt / 1000;
    const frameScale = Math.max(0.5, dt / NOMINAL_FRAME_MS);
    const t = now * 0.001;
    frameTick += 1;

    if (currentMode === 'cycle') applyCyclePalette(now);
    const mx = mouse.x;
    const my = mouse.y;

    const updateParticlesThisFrame = true;
    const updateBubblesThisFrame = true;

    if (updateParticlesThisFrame) {
      const particleDt = dt;
      for (const p of particles) {
        if (perfLite && !isMobile && p.perfRank > 0.62) {
          p.el.style.opacity = '0';
          continue;
        }
        p.drift += particleDt * 0.0007;
        p.x += p.vx * particleDt + Math.sin(p.drift * 0.5) * 0.00002;
        p.y += p.vy * particleDt;

        if (p.y < -0.03) {
          p.y = 1.03;
          p.x = Math.random();
        }
        if (p.x < -0.03) p.x = 1.03;
        if (p.x > 1.03) p.x = -0.03;

        p.el.style.opacity = p.a + 0.03 * Math.sin(t + p.drift);
        p.el.style.transform = `translate3d(${p.x * tankRect.width}px, ${p.y * tankRect.height}px, 0)`;
      }
    }

    if (updateBubblesThisFrame) {
      const bubbleDt = dt;
      for (const b of bubbles) {
        const isActive = b.intensityRank <= bubbleIntensityScale;

        if (!isActive) {
          b.y = 1.05 + Math.random() * 0.15;
          b.x = 0.015 + Math.random() * 0.03;
          b.el.style.opacity = '0';
          continue;
        }

        b.wobble += bubbleDt * 0.0016;
        b.y -= b.vy * bubbleDt;
        b.x += b.vx * bubbleDt + Math.sin(b.wobble) * 0.00010;

        if (b.y < -0.06) {
          b.y = 1.05 + Math.random() * 0.15;
          b.x = 0.015 + Math.random() * 0.03;
        }

        const scale = 0.96 + 0.06 * Math.sin(b.wobble * 1.4);
        b.el.style.transform = `translate3d(${b.x * tankRect.width}px, ${b.y * tankRect.height}px, 0) scale(${scale})`;
        b.el.style.opacity = (0.48 + ((1 - b.y) * 0.28)).toFixed(3);
      }

      for (const b of diverBubbles) {
        const isActive = b.intensityRank <= bubbleIntensityScale;

        if (!isActive) {
          b.x = 0.535 + (Math.random() - 0.5) * 0.010;
          b.y = 0.812 + Math.random() * 0.010;
          b.el.style.opacity = '0';
          continue;
        }

        b.wobble += bubbleDt * 0.0011;
        b.y -= b.vy * bubbleDt;
        b.x += b.vx * bubbleDt + Math.sin(b.wobble * 1.15) * 0.00008;

        if (b.y < 0.43) {
          b.x = 0.535 + (Math.random() - 0.5) * 0.010;
          b.y = 0.812 + Math.random() * 0.010;
        }

        const scale = 0.95 + 0.08 * Math.sin(b.wobble * 1.5);
        b.el.style.transform = `translate3d(${b.x * tankRect.width}px, ${b.y * tankRect.height}px, 0) scale(${scale})`;
        b.el.style.opacity = (0.58 + ((1 - b.y) * 0.28)).toFixed(3);
      }
    }

    if (crab) {
      if (crab.pause > 0) {
        crab.pause -= dtSec;
        if (crab.pause <= 0) chooseNewCrabGoal();
      } else {
        const deltaX = crab.targetX - crab.x;
        const stepX = crab.currentSpeed * dt;

        if (Math.abs(deltaX) <= stepX) {
          crab.x = crab.targetX;
          crab.pause = crab.pauseAfterMove || rand(0.35, 1.05);
        } else {
          crab.x += Math.sign(deltaX) * stepX;
        }

        if (Math.abs(deltaX) > 0.0004) {
          crab.dir = deltaX >= 0 ? 1 : -1;
        }
      }

      crab.x = clamp(crab.x, crab.minX, crab.maxX);

      crab.phase += dtSec * (crab.pause > 0 ? 1.5 : 4.2);

      const crawlLift = Math.sin(crab.phase) * (crab.pause > 0 ? 0.00045 : 0.0011);
      const bodyTilt = Math.sin(crab.phase * 0.55) * (crab.pause > 0 ? 0.35 : 0.9);
      const bodyScaleY = 1 + Math.sin(crab.phase * 2) * (crab.pause > 0 ? 0.006 : 0.012);
      crab.el.style.transform =
        `translate3d(${crab.x * tankRect.width}px, ${(crab.baseY + crawlLift) * tankRect.height}px, 0) translate(-50%,-50%) scale(${crab.dir}, ${bodyScaleY}) rotate(${bodyTilt}deg)`;
    }

    const tetraList = fish.filter(f => f.type === 'tetra');
    let tetraCenterX = 0.5;
    let tetraCenterY = 0.78;

    if (tetraList.length) {
      tetraCenterX = tetraList.reduce((s, f) => s + f.x, 0) / tetraList.length;
      tetraCenterY = tetraList.reduce((s, f) => s + f.y, 0) / tetraList.length;
    }

    for (const f of fish) {
      f.stateTimer -= dtSec;
      f.bobT += dtSec * 2.0;

      if (f.stateTimer <= 0) pickState(f);

      const dxm = f.x - mx;
      const dym = f.y - my;
      const dist2 = dxm * dxm + dym * dym;

      let repelX = 0;
      let repelY = 0;

      if (mouse.inside && dist2 < 0.05) {
        const strength = (0.05 - dist2) * 0.015 * f.shyness;
        repelX = dxm * strength;
        repelY = dym * strength;
        if (f.type !== 'discus' && f.state !== 'dart' && dist2 < 0.012) {
          pickState(f, 'dart');
        }
      }

      if (f.type === 'tetra') {
        const schoolMix = 0.12;
        const schoolTargetX = lerp(f.homeX, tetraCenterX, schoolMix);
        const schoolTargetY = lerp(f.homeY, tetraCenterY, schoolMix);
        f.targetX += (schoolTargetX - f.targetX) * 0.0030 * f.wander;
        f.targetY += (schoolTargetY - f.targetY) * 0.0036 * f.wander;
      }

      const tx = f.targetX - f.x;
      const ty = f.targetY - f.y;
      const dist = Math.hypot(tx, ty) || 0.00001;

      if (dist < 0.02 && (f.state === 'cruise' || f.state === 'turn')) {
        if (Math.random() < 0.02) {
          pickState(f, 'idle');
        } else {
          chooseTargetForFish(f);
        }
      }

      let desiredSpeed = 0;
      if (f.state === 'idle') desiredSpeed = f.cruiseSpeed * 0.10;
      if (f.state === 'turn') desiredSpeed = f.cruiseSpeed * 0.55;
      if (f.state === 'cruise') desiredSpeed = f.cruiseSpeed;
      if (f.state === 'dart') desiredSpeed = f.dartSpeed;

      const motionBoost = perfLite && !isMobile ? 1.42 : 1;
      const fishSpeedNow = FISH_SPEED * motionBoost * swimSpeedScale;
      const desiredVX = (tx / dist) * desiredSpeed * fishSpeedNow + repelX;
      const desiredVY = (ty / dist) * desiredSpeed * fishSpeedNow + repelY;

      const accelT = 1 - Math.pow(1 - f.accel, frameScale);
      f.vx = lerp(f.vx, desiredVX, accelT);
      f.vy = lerp(f.vy, desiredVY, accelT);

      if (f.state === 'idle') {
        const idleDrag = Math.pow(0.992, frameScale);
        f.vx *= idleDrag;
        f.vy *= idleDrag;
      } else {
        const dragT = Math.pow(f.drag, frameScale);
        f.vx *= dragT;
        f.vy *= dragT;
      }

      const intentX = Math.abs(tx) > 0.01 ? tx : desiredVX;
      const desiredDir = intentX >= 0 ? 1 : -1;
      const dirResponse = f.type === 'angel' ? 0.10 : (f.type === 'discus' ? 0.085 : (f.type === 'barb' ? 0.13 : 0.16));
      const dirResponseT = 1 - Math.pow(1 - dirResponse, frameScale);
      f.turnMomentum = lerp(f.turnMomentum, desiredDir, dirResponseT);

      if (f.turnMomentum > 0.08) f.dir = 1;
      if (f.turnMomentum < -0.08) f.dir = -1;

      if (f.dir === 1 && f.vx < 0) f.vx *= 0.35;
      if (f.dir === -1 && f.vx > 0) f.vx *= 0.35;

      f.x += f.vx * dt;
      f.y += f.vy * dt;

      if (f.type === 'angel') {
        f.x = clamp(f.x, 0.05, 0.95);
        f.y = clamp(f.y, 0.04, 0.32);
      } else if (f.type === 'tetra') {
        f.x = clamp(f.x, 0.06, 0.94);
        f.y = clamp(f.y, 0.34, 0.82);
      } else if (f.type === 'discus') {
        f.x = clamp(f.x, 0.08, 0.92);
        f.y = clamp(f.y, 0.12, 0.86);
      } else if (f.type === 'barb') {
        f.x = clamp(f.x, 0.05, 0.95);
        f.y = clamp(f.y, 0.50, 0.90);
      }

      const displayVX = Math.max(Math.abs(f.vx), Math.abs(desiredVX) * 0.65, 0.00001) * f.dir;
      const moveAngle = Math.atan2(f.vy, displayVX);
      const turnEaseT = 1 - Math.pow(1 - f.turnEase, frameScale);
      f.angle = lerp(f.angle, moveAngle, turnEaseT);

      const speedMag = Math.hypot(f.vx, f.vy);

      const tailBoost =
        f.state === 'dart' ? 2.0 :
        f.state === 'cruise' ? 1.0 :
        f.state === 'turn' ? 0.7 : 0.35;

      const bodyBob =
        f.state === 'idle'
          ? Math.sin(f.bobT * 1.5 + f.schoolPhase) * 0.0012 * f.idleBob
          : Math.sin(f.bobT * 1.8 + f.schoolPhase) * 0.0008 * f.idleBob;

      const extraSchoolY = f.type === 'tetra'
        ? Math.sin(t * 0.7 + f.schoolPhase) * 0.0014
        : 0;

      const drawY = f.y + bodyBob + extraSchoolY + f.depthOffset;
      const rotDeg = (f.angle * 180 / Math.PI) * (f.type === 'discus' ? 0.12 : (f.type === 'barb' ? 0.15 : 0.18));
      const tailDeg = Math.sin(t * 10 * tailBoost + f.schoolPhase * 2) * (speedMag * (f.type === 'discus' ? 6400 : (f.type === 'barb' ? 7600 : 9000)));
      const finalRot = rotDeg + clamp(tailDeg, f.type === 'discus' ? -3 : (f.type === 'barb' ? -3.5 : -4.5), f.type === 'discus' ? 3 : (f.type === 'barb' ? 3.5 : 4.5));

      const spriteFacing = f.nativeFacing ?? ((f.type === 'angel' || f.type === 'discus') ? -1 : 1);
      f.el.style.opacity = f.type === 'tetra' ? '0.96' : (f.type === 'discus' ? '0.98' : (f.type === 'barb' ? '0.97' : '1'));
      const drawScale = f.scale * FISH_SIZE_MULTIPLIER;
      f.el.style.transform =
        `translate3d(${f.x * tankRect.width}px, ${drawY * tankRect.height}px, 0) translate(-50%,-50%) scale(${spriteFacing * f.dir * drawScale}, ${drawScale}) rotate(${finalRot}deg)`;
    }

    scheduleBubbleAudio(now);
    requestAnimationFrame(animate);
  }

  function updatePointerFromClient(clientX, clientY) {
    const r = tank.getBoundingClientRect();
    mouse.x = clamp((clientX - r.left) / r.width, 0, 1);
    mouse.y = clamp((clientY - r.top) / r.height, 0, 1);
    mouse.inside = true;
  }

  tank.addEventListener('mousemove', (e) => {
    updatePointerFromClient(e.clientX, e.clientY);
  });

  tank.addEventListener('mouseleave', () => {
    mouse.inside = false;
    mouse.x = 0.5;
    mouse.y = 0.5;
  });

  tank.addEventListener('touchstart', (e) => {
    const touch = e.touches[0];
    if (touch) updatePointerFromClient(touch.clientX, touch.clientY);
  }, { passive:true });

  tank.addEventListener('touchmove', (e) => {
    const touch = e.touches[0];
    if (touch) updatePointerFromClient(touch.clientX, touch.clientY);
  }, { passive:true });

  tank.addEventListener('touchend', () => {
    mouse.inside = false;
    mouse.x = 0.5;
    mouse.y = 0.5;
  }, { passive:true });

  modeBtns.forEach(btn => {
    btn.addEventListener('click', () => setMode(btn.dataset.mode));
  });

  swimSpeed.addEventListener('input', (e) => {
    applySwimSpeed(e.target.value);
  });

  bubbleIntensity.addEventListener('input', (e) => {
    applyBubbleIntensity(e.target.value);
  });

  bubbleVolume.addEventListener('input', (e) => {
    applyBubbleVolume(e.target.value);
  });

  if (bubbleVolume) bubbleVolume.value = String(getInitialBubbleVolume());

  setPerfLite(prefersReducedMotion);
  setControlsOpen(getInitialControlsOpen());
  applyBubbleVolume(bubbleVolume ? bubbleVolume.value : 100);
  setBubbleSoundEnabled(getInitialBubbleSoundEnabled());
  syncFullscreenUI();
  seedScene();
  refreshTankRect();
  setMode('day');
  applyFixedLightIntensity();
  applyCycleSpeed();
  applySwimSpeed(swimSpeed.value);
  applyBubbleIntensity(bubbleIntensity.value);
  applyBubbleVolume(bubbleVolume ? bubbleVolume.value : 100);
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
