<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Ambient Aquarium Prototype</title>
<link rel="stylesheet" href="./styles.css" />
<link rel="stylesheet" href="./fish-realism.css" />
<link rel="stylesheet" href="./jack-tail.css" />

</head>
<body class="controls-collapsed">
<div class="stage" id="stage">
  <div class="room-vignette"></div>

  <div class="tank-wrap">
    <div class="tank" id="tank">
      <div class="layer photo-bg"></div>
      <div class="layer back-haze"></div>

      <div class="layer light-beams">
        <div class="beam b1"></div>
        <div class="beam b2"></div>
        <div class="beam b3"></div>
      </div>

      <div class="layer light-shimmer"></div>
      <div class="layer wheel-spectrum"></div>

      <div class="layer fish-back-layer" id="backFishLayer"></div>

      <div class="layer diver-layer">
        <img src="./diver.png" alt="" class="diver-ornament" id="diverOrnament">
      </div>

      <div class="layer diver-fade"></div>
      <div class="layer crab-layer" id="crabLayer"></div>

      <div class="layer particles" id="particles"></div>
      <div class="layer bubbles" id="bubbles"></div>
      <div class="layer fish-layer" id="fishLayer"></div>

      <div class="layer foreground-plants">
        <div class="fg-plant fg1 hero-plant"><img src="./plant1.png" alt=""></div>
        <div class="fg-plant fg2 mid-plant"><img src="./plant2.png" alt=""></div>
        <div class="fg-plant fg4 accent-plant"><img src="./plant4.png" alt=""></div>
        <div class="fg-plant fg3 right-plant"><img src="./plant3.png" alt=""></div>
      </div>

      <div class="layer ripple"></div>
      <div class="layer glass-reflection"></div>
    </div>
  </div>

  <div class="title" id="appTitle" role="button" tabindex="0" aria-expanded="false" aria-controls="controlsPanel" aria-label="Show Controls">Ambient Aquarium</div>

  <div class="controls" id="controlsPanel" aria-hidden="true">
    <div class="control-row">
      <button id="lightModeBtn" type="button" aria-label="Change light mode">Light: Day</button>
      <button id="bgToggleBtn" type="button">BG: Classic</button>
      <button id="bubbleSoundBtn" type="button" aria-pressed="false">Bubble Sound: Off</button>
      <button id="fullscreenBtn" type="button" aria-pressed="false">Fullscreen</button>
      <button id="radioToggleBtn" type="button" aria-pressed="false">♪ Radio</button>
    </div>
    <div class="control-row">
      <label class="sliderWrap" for="swimSpeed">
        <span>Speed</span>
        <input type="range" id="swimSpeed" min="0" max="100" value="20" />
        <span id="swimSpeedValue">100%</span>
      </label>
      <label class="sliderWrap" for="bubbleIntensity">
        <span>Bubbles</span>
        <input type="range" id="bubbleIntensity" min="0" max="100" value="25" />
        <span id="bubbleIntensityValue">100%</span>
      </label>
      <label class="sliderWrap" for="bubbleVolume">
        <span>Volume</span>
        <input type="range" id="bubbleVolume" min="0" max="100" value="100" />
        <span id="bubbleVolumeValue">100%</span>
      </label>
    </div>
  </div>

  <div class="radioDock" id="radioDock" aria-hidden="true">
    <section class="radioPanel" aria-label="Aquarium radio controls">
      <div class="radioTitle">
        <span class="radioTitleText">Aquarium Radio</span>
        <span class="radioStatus" id="radioStatus">idle</span>
        <button class="radioClose" id="radioCloseBtn" type="button" aria-label="Hide radio">×</button>
      </div>
      <div class="radioControlsGroup">
        <input class="radioInput" id="radioUrlInput" type="url" inputmode="url" spellcheck="false" aria-label="YouTube URL" placeholder="Paste YouTube link..." />
        <div class="radioSearchLabel">YouTube Search</div>
        <div class="radioSearchRow">
          <input class="radioSearchInput" id="radioSearchInput" type="search" inputmode="search" spellcheck="false" aria-label="Search YouTube" placeholder="Search YouTube..." />
          <button class="radioSearchBtn" type="button" id="radioSearchBtn">Find on YouTube</button>
        </div>
        <div class="radioButtons">
          <button type="button" id="radioPlayBtn">Play URL</button>
          <button type="button" id="radioDefaultBtn">Default</button>
          <button type="button" id="radioHideBtn">Hide Dial</button>
          <button type="button" id="radioStopBtn">Stop</button>
        </div>
        <p class="radioHelp">Paste a YouTube link above to play it here. Use search to open YouTube results in a new tab, then copy a video link back here.</p>
      </div>
      <div class="radioPlayerWrap" id="radioPlayerWrap">
        <iframe id="radioPlayerFrame" title="YouTube aquarium radio" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
      </div>
    </section>
  </div>
</div>

<script src="./app.js"></script>
</body>
</html>
