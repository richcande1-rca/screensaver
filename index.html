
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Ambient Aquarium Prototype</title>
<style>
:root{
  --bg:#05070b;
  --tank-w:min(62vw, 560px);
  --tank-h:min(86vh, 920px);

  --water-top:#18485f;
  --water-mid:#103547;
  --water-bottom:#08141d;

  --glass-border:rgba(255,255,255,0.12);
  --glass-highlight:rgba(255,255,255,0.08);
  --glass-shadow:rgba(0,0,0,0.45);

  --beam-a:rgba(255,255,255,0.13);
  --beam-b:rgba(255,255,255,0.00);
  --beam-rgb:255,255,255;
  --beam-alpha-hi:.13;
  --beam-alpha-lo:0;
  --light-intensity:1;
  --wheel-speed:10s;
  --wheel-play:running;
  --shimmer-base:.34;

  --tank-glow:rgba(90,170,220,0.20);
  --ui-bg:rgba(10,14,18,0.72);
  --ui-border:rgba(255,255,255,0.10);
  --ui-text:#d8e7ef;

  --particle:rgba(230,245,255,0.18);
  --bubble:rgba(230,247,255,0.45);

  --fish-glow:drop-shadow(0 0 8px rgba(120,220,255,0.15));

  --mode-sat:1;
  --mode-bright:1;
  --mode-contrast:1;
  --mode-hue:0deg;
  --mode-overlay:rgba(0,0,0,0);

  --photo-blur:0px;
  --diver-blur:.12px;
  --shimmer-opacity:.34;
  --ripple-display:block;
  --ripple-opacity:.14;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  height:100%;
  background:
    radial-gradient(circle at 50% 45%, rgba(20,35,55,0.22), transparent 40%),
    radial-gradient(circle at 50% 50%, rgba(0,0,0,0.15), transparent 50%),
    linear-gradient(180deg, #05070b 0%, #020305 100%);
  overflow:hidden;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  color:var(--ui-text);
}

body{
  display:grid;
  place-items:center;
}

.stage{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
}

.room-vignette{
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(circle at 50% 50%, transparent 18%, rgba(0,0,0,0.10) 55%, rgba(0,0,0,0.60) 100%),
    radial-gradient(circle at 50% 50%, rgba(80,170,210,0.06), transparent 24%);
}

.tank-wrap{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:var(--tank-w);
  height:var(--tank-h);
  display:flex;
  align-items:center;
  justify-content:center;
  filter:
    drop-shadow(0 18px 50px rgba(0,0,0,0.55))
    drop-shadow(0 0 35px var(--tank-glow));
}

.tank{
  position:relative;
  width:100%;
  height:100%;
  overflow:hidden;
  border-radius:26px;
  border:1px solid var(--glass-border);
  background:
    linear-gradient(180deg,
      color-mix(in srgb, var(--water-top) 94%, white 6%) 0%,
      var(--water-mid) 38%,
      var(--water-bottom) 100%);
  box-shadow:
    inset 0 1px 0 var(--glass-highlight),
    inset 0 -30px 80px rgba(0,0,0,0.25),
    inset 24px 0 50px rgba(0,0,0,0.12),
    inset -24px 0 50px rgba(0,0,0,0.12),
    0 18px 40px var(--glass-shadow);
  isolation:isolate;
  filter:
    saturate(var(--mode-sat))
    brightness(var(--mode-bright))
    contrast(var(--mode-contrast))
    hue-rotate(var(--mode-hue));
}

.tank::before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(90deg,
      rgba(255,255,255,0.06) 0%,
      rgba(255,255,255,0.015) 8%,
      transparent 18%,
      transparent 82%,
      rgba(255,255,255,0.015) 92%,
      rgba(255,255,255,0.055) 100%);
  mix-blend-mode:screen;
  z-index:50;
}

.tank::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:var(--mode-overlay);
  z-index:49;
}

.layer{
  position:absolute;
  inset:0;
  pointer-events:none;
}

.photo-bg{
  z-index:1;
  background:
    linear-gradient(180deg, rgba(0,0,0,0.10), rgba(0,0,0,0.24)),
    url("./aquarium-bg.png") center center / cover no-repeat;
  filter:
    saturate(.92)
    brightness(.78)
    contrast(1.02)
    blur(var(--photo-blur));
  transform:scale(1.03);
  opacity:.92;
}

.back-haze{
  z-index:2;
  background:
    radial-gradient(circle at 50% 35%, rgba(160,220,255,0.09), transparent 26%),
    radial-gradient(circle at 26% 48%, rgba(120,220,180,0.05), transparent 22%),
    radial-gradient(circle at 75% 55%, rgba(120,220,180,0.04), transparent 26%);
  opacity:.9;
  animation:hazeDrift 18s ease-in-out infinite alternate;
}

.light-beams{
  z-index:3;
  overflow:hidden;
  mix-blend-mode:screen;
  opacity:.95;
}

.beam{
  position:absolute;
  top:-10%;
  width:18%;
  height:70%;
  background:linear-gradient(
    180deg,
    rgba(var(--beam-rgb), calc(var(--beam-alpha-hi) * var(--light-intensity))),
    rgba(var(--beam-rgb), calc(var(--beam-alpha-lo) * var(--light-intensity)))
  );
  filter:blur(8px);
  transform-origin:top center;
  opacity:.7;
  animation:beamSway 10s ease-in-out infinite alternate;
}

.beam.b1{ left:20%; transform:rotate(-10deg); animation-duration:13s; }
.beam.b2{ left:39%; transform:rotate(-3deg); animation-duration:11s; opacity:.55; }
.beam.b3{ left:56%; transform:rotate(7deg); animation-duration:15s; opacity:.48; }

.light-shimmer{
  z-index:4;
  left:0;
  top:0;
  width:100%;
  height:44%;
  opacity:calc(var(--shimmer-base) * var(--light-intensity));
  mix-blend-mode:screen;
  overflow:hidden;
  -webkit-mask-image:linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,.95) 38%, rgba(0,0,0,.45) 72%, rgba(0,0,0,0) 100%);
  mask-image:linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,.95) 38%, rgba(0,0,0,.45) 72%, rgba(0,0,0,0) 100%);
}

.light-shimmer::before{
  content:"";
  position:absolute;
  inset:-8% -20%;
  background:
    repeating-linear-gradient(
      103deg,
      rgba(255,255,255,0.00) 0px,
      rgba(255,255,255,0.00) 18px,
      rgba(255,255,255,0.20) 28px,
      rgba(255,255,255,0.08) 38px,
      rgba(255,255,255,0.00) 54px,
      rgba(255,255,255,0.00) 78px
    ),
    repeating-linear-gradient(
      79deg,
      rgba(180,220,255,0.00) 0px,
      rgba(180,220,255,0.12) 16px,
      rgba(180,220,255,0.00) 34px,
      rgba(255,255,255,0.10) 48px,
      rgba(255,255,255,0.00) 72px
    );
  filter:blur(1.5px);
  transform:translateX(0) translateY(0) scale(1.04);
  animation:topShimmerMove 4.8s linear infinite;
}

.wheel-spectrum{
  z-index:5;
  opacity:0;
  overflow:hidden;
  mix-blend-mode:screen;
  transition:opacity .35s ease;
  -webkit-mask-image:linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,.96) 38%, rgba(0,0,0,.52) 72%, rgba(0,0,0,0) 100%);
  mask-image:linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,.96) 38%, rgba(0,0,0,.52) 72%, rgba(0,0,0,0) 100%);
}

.wheel-spectrum::before{
  content:"";
  position:absolute;
  inset:-34% -30% -22% -30%;
  border-radius:50%;
  background:conic-gradient(
    from 0deg,
    rgba(255,82,112,0.00) 0deg,
    rgba(255,82,112,0.95) 38deg,
    rgba(255,176,74,0.95) 82deg,
    rgba(255,233,96,0.92) 122deg,
    rgba(98,255,168,0.90) 170deg,
    rgba(82,235,255,0.90) 220deg,
    rgba(100,132,255,0.92) 270deg,
    rgba(214,96,255,0.94) 322deg,
    rgba(255,82,112,0.95) 360deg
  );
  filter:blur(46px) saturate(1.15) brightness(1.06);
  transform-origin:50% 42%;
  animation:wheelSpin var(--wheel-speed) linear infinite;
  animation-play-state:var(--wheel-play);
}

.wheel-spectrum::after{
  content:"";
  position:absolute;
  inset:-2% -28% 32% -28%;
  background:linear-gradient(
    90deg,
    rgba(255,92,120,0.00) 0%,
    rgba(255,92,120,0.38) 12%,
    rgba(255,182,86,0.36) 24%,
    rgba(255,239,110,0.34) 36%,
    rgba(98,255,170,0.34) 50%,
    rgba(86,232,255,0.34) 64%,
    rgba(110,136,255,0.36) 78%,
    rgba(220,100,255,0.38) 90%,
    rgba(255,92,120,0.00) 100%
  );
  background-size:220% 100%;
  filter:blur(20px) saturate(1.12) brightness(1.05);
  animation:wheelSweep var(--wheel-sweep-speed) linear infinite;
  animation-play-state:var(--wheel-play);
}

.tank.light-wheel .wheel-spectrum{
  opacity:calc(.72 * var(--light-intensity));
}

.tank.light-wheel .light-beams{
  opacity:1;
}

.tank.light-wheel .light-shimmer{
  opacity:calc((var(--shimmer-base) + .10) * var(--light-intensity));
}

.tank.light-wheel .beam.b1{ left:15%; }
.tank.light-wheel .beam.b2{ left:39%; }
.tank.light-wheel .beam.b3{ left:63%; }

.diver-layer{
  z-index:6;
  pointer-events:none;
}

.diver-ornament{
  position:absolute;
  left:53%;
  bottom:4.6%;
  width:12.4%;
  max-width:70px;
  opacity:.90;
  filter:
    saturate(.88)
    brightness(.93)
    contrast(1.12)
    blur(var(--diver-blur))
    drop-shadow(0 2px 6px rgba(0,0,0,0.24))
    drop-shadow(0 0 4px rgba(190,220,235,0.10));
  transform:translateX(-50%);
  transform-origin:50% 85%;
}

.diver-fade{
  z-index:7;
  pointer-events:none;
  background:
    radial-gradient(
      circle at 53% 84%,
      rgba(70,150,210,0.00) 0%,
      rgba(70,150,210,0.00) 6%,
      rgba(70,150,210,0.06) 12%,
      rgba(40,110,180,0.10) 18%,
      rgba(20,60,120,0.06) 26%,
      rgba(0,0,0,0.00) 38%
    );
  mix-blend-mode:screen;
  opacity:.26;
  filter:blur(4px);
}

.particles,
.bubbles,
.fish-layer{
  z-index:9;
}

.fish-back-layer{
  z-index:5;
}

.foreground-plants{
  z-index:16;
  overflow:hidden;
}

.fg-plant{
  position:absolute;
  bottom:-6.5%;
  width:12%;
  transform-origin:50% 100%;
  opacity:.44;
  filter:none;
  animation:fgPlantSway 8s ease-in-out infinite alternate;
}

.fg-plant img{
  display:block;
  width:100%;
  height:auto;
  pointer-events:none;
  user-select:none;
  -webkit-user-drag:none;
}

.fg1{
  left:4%;
  width:22%;
  bottom:-7.8%;
  animation-duration:9.2s;
  animation-delay:-1.8s;
  opacity:.50;
}

.fg2{
  left:33%;
  width:24%;
  bottom:-10.2%;
  animation-duration:8.4s;
  animation-delay:-2.6s;
  opacity:.60;
}

.fg4{
  left:54%;
  width:29%;
  bottom:1.2%;
  animation-duration:7.9s;
  animation-delay:-1.1s;
  opacity:1;
  z-index:8;
  filter:drop-shadow(0 2px 6px rgba(0,0,0,0.22));
}

.fg3{
  right:-2%;
  width:24%;
  bottom:-9.2%;
  animation-duration:10.1s;
  animation-delay:-3.3s;
  opacity:.48;
}

.hero-plant{
  z-index:2;
}

.mid-plant{
  z-index:3;
}

.accent-plant{
  z-index:4;
}

.right-plant{
  z-index:2;
}

.ripple{
  z-index:20;
  display:var(--ripple-display);
  opacity:var(--ripple-opacity);
  mix-blend-mode:screen;
  background:
    repeating-linear-gradient(
      100deg,
      rgba(255,255,255,0.18) 0px,
      rgba(255,255,255,0.06) 6px,
      rgba(255,255,255,0.00) 20px,
      rgba(255,255,255,0.05) 34px,
      rgba(255,255,255,0.00) 54px
    );
  filter:blur(8px);
  animation:rippleShift 11s linear infinite;
}

.glass-reflection{
  z-index:30;
  background:
    linear-gradient(112deg,
      transparent 0%,
      transparent 58%,
      rgba(255,255,255,0.06) 66%,
      rgba(255,255,255,0.00) 74%,
      transparent 82%);
  opacity:.75;
}

.particle{
  position:absolute;
  width:4px;
  height:4px;
  border-radius:50%;
  background:var(--particle);
  filter:blur(.2px);
}

.bubble{
  position:absolute;
  width:10px;
  height:10px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,0.35);
  background:radial-gradient(circle at 35% 35%, rgba(255,255,255,0.45), rgba(255,255,255,0.05) 55%, transparent 65%);
  box-shadow:inset -1px -1px 3px rgba(255,255,255,0.18);
  opacity:.7;
}

.fish{
  position:absolute;
  will-change:transform;
  filter:var(--fish-glow);
}

.fish-sprite{
  position:absolute;
  display:block;
  width:100%;
  height:100%;
  object-fit:contain;
  pointer-events:none;
  user-select:none;
  -webkit-user-drag:none;
  image-rendering:auto;
  background:transparent;
  filter:drop-shadow(0 0 8px rgba(120,220,255,0.10));
}

.tetra{
  width:52px;
  height:28px;
}

.angel{
  width:92px;
  height:128px;
}

.discus{
  width:74px;
  height:74px;
}

.barb{
  width:60px;
  height:34px;
}

.controls{
  position:fixed;
  left:50%;
  bottom:calc(12px + env(safe-area-inset-bottom, 0px));
  transform:translateX(-50%);
  z-index:1000;
  display:flex;
  flex-direction:column;
  gap:8px;
  align-items:stretch;
  justify-content:center;
  padding:10px;
  min-width:min(92vw, 720px);
  border:1px solid var(--ui-border);
  border-radius:18px;
  background:var(--ui-bg);
  backdrop-filter:blur(8px);
  box-shadow:0 10px 30px rgba(0,0,0,0.35);
  pointer-events:auto;
}

.control-row{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  align-items:center;
  justify-content:center;
}

.controls button{
  appearance:none;
  border:1px solid rgba(255,255,255,0.11);
  background:rgba(255,255,255,0.06);
  color:var(--ui-text);
  padding:8px 12px;
  border-radius:12px;
  font-size:13px;
  cursor:pointer;
  transition:.18s ease;
  touch-action:manipulation;
}

.controls button:hover{
  background:rgba(255,255,255,0.11);
  transform:translateY(-1px);
}

.controls button.active{
  background:rgba(120,210,255,0.16);
  border-color:rgba(150,230,255,0.25);
  box-shadow:0 0 0 1px rgba(150,230,255,0.08) inset;
}

.sliderWrap,
.wheelWrap{
  display:flex;
  align-items:center;
  gap:8px;
  padding:6px 10px;
  border:1px solid rgba(255,255,255,0.10);
  border-radius:12px;
  background:rgba(255,255,255,0.04);
  min-height:38px;
}

.sliderWrap span,
.wheelWrap span{
  font-size:12px;
  letter-spacing:.03em;
  color:rgba(225,240,248,0.82);
  white-space:nowrap;
}

#lightIntensity{
  width:min(220px, 42vw);
  accent-color:rgb(140, 220, 255);
}

#lightIntensityValue{
  min-width:42px;
  text-align:right;
  font-variant-numeric:tabular-nums;
  color:rgba(225,240,248,0.78);
}

#cycleSpeed{
  width:min(150px, 28vw);
  accent-color:rgb(255, 168, 214);
}

#cycleSpeedValue{
  min-width:42px;
  text-align:right;
  font-variant-numeric:tabular-nums;
  color:rgba(225,240,248,0.78);
}

.wheelBadge{
  inline-size:24px;
  block-size:24px;
  border-radius:999px;
  display:grid;
  place-items:center;
  border:1px solid rgba(255,255,255,0.18);
  background:rgba(255,255,255,0.04);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,0.03);
  overflow:hidden;
  flex:0 0 auto;
}

.wheelDisc{
  inline-size:18px;
  block-size:18px;
  border-radius:999px;
  background:conic-gradient(
    #ff4d66 0deg,
    #ffb347 55deg,
    #ffe84d 100deg,
    #52ff94 150deg,
    #45e7ff 210deg,
    #6f79ff 265deg,
    #db5bff 320deg,
    #ff4d66 360deg
  );
  filter:saturate(1.08) brightness(1.05);
  animation:wheelSpin var(--wheel-speed) linear infinite;
  animation-play-state:var(--wheel-play);
}

.title{
  position:fixed;
  top:max(12px, env(safe-area-inset-top, 0px));
  left:50%;
  transform:translateX(-50%);
  z-index:1000;
  font-size:14px;
  font-weight:700;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:#dff6ff;
  background:linear-gradient(180deg, rgba(170,235,255,0.16), rgba(8,12,18,0.46));
  padding:8px 12px;
  border-radius:999px;
  border:1px solid rgba(191,230,255,0.50);
  backdrop-filter:blur(6px);
  -webkit-text-stroke:.85px rgba(191,230,255,0.78);
  paint-order:stroke fill;
  text-shadow:
    0 0 2px rgba(255,255,255,0.92),
    0 0 8px rgba(191,230,255,0.96),
    0 0 18px rgba(191,230,255,0.68),
    0 0 34px rgba(191,230,255,0.32);
  box-shadow:
    0 0 14px rgba(191,230,255,0.24),
    0 0 34px rgba(191,230,255,0.14),
    inset 0 0 12px rgba(191,230,255,0.12);
  transition:
    color 220ms linear,
    border-color 220ms linear,
    text-shadow 220ms linear,
    box-shadow 220ms linear,
    background 220ms linear,
    -webkit-text-stroke-color 220ms linear;
}

@keyframes beamSway{
  from{ transform:translateY(0) rotate(-8deg); }
  to{ transform:translateY(1.5%) rotate(-4deg); }
}

@keyframes hazeDrift{
  from{ transform:translateX(-1.2%) translateY(-0.5%); }
  to{ transform:translateX(1.2%) translateY(0.8%); }
}

@keyframes rippleShift{
  from{ transform:translateX(-4%) translateY(-1%) scale(1.02); }
  to{ transform:translateX(4%) translateY(1%) scale(1.04); }
}

@keyframes topShimmerMove{
  0%{
    transform:translateX(-8%) translateY(0%) scale(1.04);
  }
  50%{
    transform:translateX(2%) translateY(1.2%) scale(1.07);
  }
  100%{
    transform:translateX(10%) translateY(0%) scale(1.04);
  }
}

@keyframes fgPlantSway{
  from{ transform:rotate(-3.2deg) translateY(0); }
  to{ transform:rotate(3.8deg) translateY(-0.4%); }
}

@keyframes wheelSweep{
  from{
    transform:translateX(-12%) translateY(0) scaleX(1.03);
  }
  to{
    transform:translateX(12%) translateY(0) scaleX(1.03);
  }
}

@keyframes wheelSpin{
  from{ transform:rotate(0deg); }
  to{ transform:rotate(360deg); }
}

@media (max-width: 800px){
  :root{
    --tank-w:min(98vw, 620px);
    --tank-h:min(62vh, 560px);
    --photo-blur:0px;
    --diver-blur:.08px;
    --shimmer-opacity:.24;
    --ripple-display:none;
    --ripple-opacity:0;
  }

  .tank-wrap{
    top:41.5%;
    filter:
      drop-shadow(0 12px 28px rgba(0,0,0,0.45))
      drop-shadow(0 0 20px var(--tank-glow));
  }

  .beam{
    filter:blur(5px);
  }

  .fish{
    filter:none;
  }

  .fish-sprite{
    filter:none;
  }

  .glass-reflection{
    opacity:.52;
  }

  .fg1{
    left:2%;
    width:26%;
    bottom:-9.2%;
    opacity:.44;
  }

  .fg2{
    left:30%;
    width:29%;
    bottom:-11.4%;
    opacity:.50;
  }

  .fg4{
    left:53%;
    width:34%;
    bottom:0.8%;
    opacity:.99;
    z-index:8;
    filter:drop-shadow(0 2px 6px rgba(0,0,0,0.22));
  }

  .fg3{
    right:-4%;
    width:28%;
    bottom:-11.2%;
    opacity:.44;
  }

  .diver-ornament{
    left:53%;
    bottom:4.4%;
    width:14%;
    max-width:68px;
    opacity:.88;
  }

  .title{
    font-size:12px;
    padding:6px 10px;
  }

  .controls{
    bottom:calc(10px + env(safe-area-inset-bottom, 0px));
    padding:7px;
    gap:6px;
    min-width:min(96vw, 620px);

<body>
<div class="stage" id="stage">
  <div class="room-vignette"></div>

  <div class="tank-wrap">
    <div class="tank" id="tank">
      <div class="layer photo-bg"></div>
      <div class="layer back-haze"></div>

      <div class="layer light-beams">
        <div class="beam b1"></div>
        <div class="beam b2"></div>
        <div class="beam b3"></div>
      </div>

      <div class="layer light-shimmer"></div>
      <div class="layer wheel-spectrum"></div>

      <div class="layer fish-back-layer" id="backFishLayer"></div>

      <div class="layer diver-layer">
        <img src="./diver.png" alt="" class="diver-ornament" id="diverOrnament">
      </div>

      <div class="layer diver-fade"></div>

      <div class="layer particles" id="particles"></div>
      <div class="layer bubbles" id="bubbles"></div>
      <div class="layer fish-layer" id="fishLayer"></div>

      <div class="layer foreground-plants">
        <div class="fg-plant fg1 hero-plant"><img src="./plant1.png" alt=""></div>
        <div class="fg-plant fg2 mid-plant"><img src="./plant2.png" alt=""></div>
        <div class="fg-plant fg4 accent-plant"><img src="./plant4.png" alt=""></div>
        <div class="fg-plant fg3 right-plant"><img src="./plant3.png" alt=""></div>
      </div>

      <div class="layer ripple"></div>
      <div class="layer glass-reflection"></div>
    </div>
  </div>

  <div class="title" id="appTitle">Ambient Aquarium</div>

  <div class="controls">
    <div class="control-row">
      <button class="modeBtn active" data-mode="day">Day</button>
      <button class="modeBtn" data-mode="moon">Moon</button>
      <button class="modeBtn" data-mode="uv">UV</button>
      <button class="modeBtn" data-mode="dusk">Dusk</button>
      <button class="modeBtn" data-mode="emerald">Emerald</button>
      <button class="modeBtn" data-mode="rose">Rose</button>
      <button class="modeBtn" data-mode="cycle">Cycle</button>
    </div>
    <div class="control-row">
      <label class="sliderWrap" for="lightIntensity">
        <span>Light</span>
        <input type="range" id="lightIntensity" min="0" max="160" value="100" />
        <span id="lightIntensityValue">100%</span>
      </label>
      <label class="sliderWrap" for="cycleSpeed">
        <span>Cycle</span>
        <input type="range" id="cycleSpeed" min="0" max="200" value="100" />
        <span id="cycleSpeedValue">100%</span>
      </label>
    </div>
  </div>
</div>

<script>
(() => {
  const tank = document.getElementById('tank');
  const fishLayer = document.getElementById('fishLayer');
  const backFishLayer = document.getElementById('backFishLayer');
  const particlesEl = document.getElementById('particles');
  const bubblesEl = document.getElementById('bubbles');
  const titleEl = document.getElementById('appTitle');
  const modeBtns = [...document.querySelectorAll('.modeBtn')];
  const lightIntensity = document.getElementById('lightIntensity');
  const lightIntensityValue = document.getElementById('lightIntensityValue');
  const cycleSpeed = document.getElementById('cycleSpeed');
  const cycleSpeedValue = document.getElementById('cycleSpeedValue');

  const isMobile = window.matchMedia('(max-width: 800px)').matches;

  const mouse = { x: 0.5, y: 0.5, inside: false };
  const fish = [];
  const particles = [];
  const bubbles = [];
  const diverBubbles = [];

  const FISH_SPEED = isMobile ? 3.6 : 3.95;
  const FISH_SIZE_MULTIPLIER = 2;
  const PARTICLE_COUNT = isMobile ? 22 : 55;
  const BUBBLE_COUNT = isMobile ? 10 : 18;
  const DIVER_BUBBLE_COUNT = isMobile ? 6 : 10;
  const TETRA_COUNT = 8;
  const ANGEL_COUNT = 3;
  const DISCUS_COUNT = 1;
  const BARB_COUNT = 3;
  const TETRA_SPRITES = [
    { src: './tetra1.png', facing: 1 },
    { src: './tetra2.png', facing: -1 }
  ];

  function rand(a, b) { return a + Math.random() * (b - a); }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  function setPresetBeam(r, g, b) {
    const root = document.documentElement.style;
    root.setProperty('--beam-rgb', `${r},${g},${b}`);
    root.setProperty('--tank-glow', `rgba(${r},${g},${b},0.20)`);

    if (titleEl) {
      titleEl.style.color = `rgb(${r}, ${g}, ${b})`;
      titleEl.style.borderColor = `rgba(${r}, ${g}, ${b}, 0.52)`;
      titleEl.style.webkitTextStrokeColor = `rgba(${r}, ${g}, ${b}, 0.82)`;
      titleEl.style.background = `linear-gradient(180deg, rgba(${r}, ${g}, ${b}, 0.18), rgba(8,12,18,0.46))`;
      titleEl.style.textShadow = [
        '0 0 2px rgba(255,255,255,0.92)',
        `0 0 8px rgba(${r}, ${g}, ${b}, 0.98)`,
        `0 0 18px rgba(${r}, ${g}, ${b}, 0.68)`,
        `0 0 34px rgba(${r}, ${g}, ${b}, 0.32)`
      ].join(', ');
      titleEl.style.boxShadow = [
        `0 0 14px rgba(${r}, ${g}, ${b}, 0.24)`,
        `0 0 34px rgba(${r}, ${g}, ${b}, 0.14)`,
        `inset 0 0 12px rgba(${r}, ${g}, ${b}, 0.12)`
      ].join(', ');
    }
  }

  function applyCycleSpeed(value) {
    const n = clamp(Number(value) || 0, 0, 200);
    if (cycleSpeedValue) cycleSpeedValue.textContent = `${Math.round(n)}%`;
    const root = document.documentElement.style;
    if (n <= 0) {
      root.setProperty('--wheel-speed', '10s');
      root.setProperty('--wheel-sweep-speed', '7.2s');
      root.setProperty('--wheel-play', 'paused');
      return;
    }
    const duration = 11 - (n / 200) * 9;
    const sweepDuration = duration * 0.72;
    root.setProperty('--wheel-speed', `${duration.toFixed(2)}s`);
    root.setProperty('--wheel-sweep-speed', `${sweepDuration.toFixed(2)}s`);
    root.setProperty('--wheel-play', 'running');
  }

  function applyLightIntensity(value) {
    const n = clamp(Number(value) || 100, 0, 160);
    document.documentElement.style.setProperty('--light-intensity', (n / 50).toFixed(2));
    if (lightIntensityValue) lightIntensityValue.textContent = `${Math.round(n)}%`;
  }

  let currentMode = 'day';
  let cyclePhase = 0;

  function hslToRgb(h, s, l) {
    const hue = ((h % 360) + 360) % 360;
    const sat = clamp(s, 0, 100) / 100;
    const light = clamp(l, 0, 100) / 100;

    const c = (1 - Math.abs(2 * light - 1)) * sat;
    const x = c * (1 - Math.abs(((hue / 60) % 2) - 1));
    const m = light - c / 2;

    let r1 = 0, g1 = 0, b1 = 0;

    if (hue < 60) [r1, g1, b1] = [c, x, 0];
    else if (hue < 120) [r1, g1, b1] = [x, c, 0];
    else if (hue < 180) [r1, g1, b1] = [0, c, x];
    else if (hue < 240) [r1, g1, b1] = [0, x, c];
    else if (hue < 300) [r1, g1, b1] = [x, 0, c];
    else [r1, g1, b1] = [c, 0, x];

    return [
      Math.round((r1 + m) * 255),
      Math.round((g1 + m) * 255),
      Math.round((b1 + m) * 255)
    ];
  }

  function applyCyclePalette(timeMs) {
    const speed = clamp(Number(cycleSpeed?.value) || 100, 0, 200);

    if (speed > 0) {
      const duration = 34 - (speed / 200) * 28;
      cyclePhase = ((timeMs * 0.001) / duration) % 1;
    }

    const hue = (205 + cyclePhase * 360) % 360;
    const [topR, topG, topB] = hslToRgb(hue, 48, 21);
    const [midR, midG, midB] = hslToRgb(hue + 10, 42, 14);
    const [bottomR, bottomG, bottomB] = hslToRgb(hue + 20, 45, 7);
    const [beamR, beamG, beamB] = hslToRgb(hue + 26, 92, 72);
    const [overlayR, overlayG, overlayB] = hslToRgb(hue + 8, 58, 24);

    const r = document.documentElement.style;
    r.setProperty('--water-top', `rgb(${topR},${topG},${topB})`);
    r.setProperty('--water-mid', `rgb(${midR},${midG},${midB})`);
    r.setProperty('--water-bottom', `rgb(${bottomR},${bottomG},${bottomB})`);
    r.setProperty('--beam-rgb', `${beamR},${beamG},${beamB}`);
    r.setProperty('--beam-alpha-hi', '.17');
    r.setProperty('--beam-alpha-lo', '0');
    r.setProperty('--shimmer-base', '.33');
    r.setProperty('--mode-sat', '1.08');
    r.setProperty('--mode-bright', '.99');
    r.setProperty('--mode-contrast', '1.07');
    r.setProperty('--mode-hue', '0deg');
    r.setProperty('--mode-overlay', `linear-gradient(180deg, rgba(${overlayR},${overlayG},${overlayB},0.08), rgba(${bottomR},${bottomG},${bottomB},0.14))`);
    setPresetBeam(beamR, beamG, beamB);
  }

  function makeEl(html) {
    const wrap = document.createElement('div');
    wrap.innerHTML = html.trim();
    return wrap.firstChild;
  }

  function chooseTargetForFish(f) {
    if (f.type === 'angel') {
      const cx = f.homeX ?? 0.50;
      const cy = f.homeY ?? 0.18;
      const spreadX = isMobile ? 0.34 : 0.40;
      const spreadY = isMobile ? 0.09 : 0.11;
      f.targetX = clamp(cx + rand(-spreadX, spreadX), 0.06, 0.94);
      f.targetY = clamp(cy + rand(-spreadY, spreadY), 0.05, 0.31);
    } else if (f.type === 'tetra') {
      const cx = f.homeX ?? 0.50;
      const cy = f.homeY ?? 0.58;
      const spreadX = isMobile ? 0.24 : 0.31;
      const spreadY = isMobile ? 0.10 : 0.13;
      const dipToBottom = Math.random() < 0.16;

      f.targetX = clamp(cx + rand(-spreadX, spreadX), 0.06, 0.94);

      if (dipToBottom) {
        f.targetY = rand(0.70, 0.82);
      } else {
        f.targetY = clamp(cy + rand(-spreadY, spreadY), 0.36, 0.74);
      }
    } else if (f.type === 'discus') {
      const cruiseBandRoll = Math.random();
      f.targetX = rand(0.08, 0.92);

      if (cruiseBandRoll < 0.24) {
        f.targetY = rand(0.12, 0.34);
      } else if (cruiseBandRoll < 0.68) {
        f.targetY = rand(0.34, 0.68);
      } else {
        f.targetY = rand(0.68, 0.86);
      }
    } else if (f.type === 'barb') {
      const cx = f.homeX ?? 0.50;
      const cy = f.homeY ?? 0.66;
      const spreadX = isMobile ? 0.38 : 0.46;
      const spreadY = isMobile ? 0.14 : 0.18;
      const bottomRun = Math.random() < 0.28;

      f.targetX = clamp(cx + rand(-spreadX, spreadX), 0.05, 0.95);

      if (bottomRun) {
        f.targetY = rand(0.74, 0.89);
      } else {
        f.targetY = clamp(cy + rand(-spreadY, spreadY), 0.50, 0.86);
      }
    }
  }

  function pickState(f, force) {
    if (f.type === 'discus') {
      if (force === 'idle' || force === 'cruise') {
        f.state = force;
      } else {
        f.state = Math.random() < 0.26 ? 'idle' : 'cruise';
      }

      if (f.state === 'idle') {
        f.stateTimer = rand(2.8, 5.0);
      } else {
        f.state = 'cruise';
        f.stateTimer = rand(7.0, 12.5);
        chooseTargetForFish(f);
      }
      return;
    }

    if (force) {
      f.state = force;
    } else {
      const r = Math.random();
      if (f.type === 'tetra') {
        if (r < 0.18) f.state = 'idle';
        else if (r < 0.92) f.state = 'cruise';
        else if (r < 0.985) f.state = 'turn';
        else f.state = 'dart';
      } else if (f.type === 'angel') {
        if (r < 0.30) f.state = 'idle';
        else if (r < 0.93) f.state = 'cruise';
        else if (r < 0.99) f.state = 'turn';
        else f.state = 'dart';
      } else if (f.type === 'barb') {
        if (r < 0.20) f.state = 'idle';
        else if (r < 0.91) f.state = 'cruise';
        else if (r < 0.985) f.state = 'turn';
        else f.state = 'dart';
      }
    }

    if (f.state === 'idle') {
      f.stateTimer = rand(2.4, 5.8);
    } else if (f.state === 'cruise') {
      f.stateTimer = rand(3.8, 8.5);
      chooseTargetForFish(f);
    } else if (f.state === 'turn') {
      f.stateTimer = rand(0.9, 2.1);
      chooseTargetForFish(f);
    } else if (f.state === 'dart') {
      f.stateTimer = rand(0.28, 0.62);
      chooseTargetForFish(f);
      f.targetX += rand(-0.08, 0.08);
      f.targetY += rand(-0.06, 0.06);
    }
  }

  function makeFishBase(type, el, x, y, scale) {
    const f = {
      type,
      el,
      x, y,
      vx: 0,
      vy: 0,
      dir: 1,
      angle: 0,
      bobT: Math.random() * 10,
      schoolPhase: Math.random() * 6.28,
      scale,
      targetX: x,
      targetY: y,
      state: 'cruise',
      stateTimer: rand(2, 5),
      cruiseSpeed: 0.00010,
      dartSpeed: 0.00022,
      accel: 0.006,
      drag: 0.991,
      turnEase: 0.045,
      wander: rand(0.85, 1.15),
      shyness: rand(0.8, 1.2),
      idleBob: rand(0.8, 1.2),
      depthOffset: rand(-0.006, 0.006),
      turnMomentum: 0,
      riseCooldown: 0,
      zone: null,
      homeX: clamp(x + rand(-0.03, 0.03), 0.12, 0.88),
      homeY: clamp(y + rand(-0.02, 0.02), 0.22, 0.72)
    };
    chooseTargetForFish(f);
    pickState(f, 'cruise');
    return f;
  }

  function createTetra(x, y, scale = 1, sprite = pick(TETRA_SPRITES)) {
    const spriteSrc = typeof sprite === 'string' ? sprite : sprite.src;
    const nativeFacing = typeof sprite === 'string' ? 1 : (sprite.facing ?? 1);

    const el = makeEl(`
      <div class="fish tetra">
        <img class="fish-sprite" src="${spriteSrc}" alt="">
      </div>
    `);

    fishLayer.appendChild(el);

    const f = makeFishBase('tetra', el, x, y, scale);
    f.nativeFacing = nativeFacing;
    f.cruiseSpeed = rand(0.000075, 0.00011);
    f.dartSpeed = rand(0.00016, 0.00024);
    f.accel = rand(0.0042, 0.0068);
    f.drag = rand(0.992, 0.9955);
    f.turnEase = rand(0.042, 0.065);
    f.homeX = clamp(x + rand(-0.18, 0.18), 0.08, 0.92);
    f.homeY = clamp(y + rand(-0.06, 0.06), 0.44, 0.70);
    fish.push(f);
  }

  function createBarb(x, y, scale = 1, spriteSrc = './barb1.png') {
    const el = makeEl(`
      <div class="fish barb">
        <img class="fish-sprite" src="${spriteSrc}" alt="">
      </div>
    `);

    fishLayer.appendChild(el);

    const f = makeFishBase('barb', el, x, y, scale);
    f.nativeFacing = spriteSrc.includes('barb2') ? -1 : 1;
    f.cruiseSpeed = rand(0.000055, 0.000082);
    f.dartSpeed = rand(0.00012, 0.00018);
    f.accel = rand(0.0038, 0.0059);
    f.drag = rand(0.9924, 0.9953);
    f.turnEase = rand(0.040, 0.056);
    f.homeX = clamp(x + rand(-0.20, 0.20), 0.08, 0.92);
    f.homeY = clamp(y + rand(-0.08, 0.08), 0.54, 0.82);
    chooseTargetForFish(f);
    fish.push(f);
  }

  function createAngel(x, y, scale = 1, spriteSrc = './angel.png', zone = null) {
    const el = makeEl(`
      <div class="fish angel">
        <img class="fish-sprite" src="${spriteSrc}" alt="">
      </div>
    `);

    fishLayer.appendChild(el);

    const f = makeFishBase('angel', el, x, y, scale);
    f.zone = zone;
    f.cruiseSpeed = rand(0.00005, 0.000078);
    f.dartSpeed = rand(0.000105, 0.000155);
    f.accel = rand(0.0033, 0.0052);
    f.drag = rand(0.9925, 0.9955);
    f.turnEase = rand(0.031, 0.045);
    f.homeX = clamp(x + rand(-0.16, 0.16), 0.10, 0.90);
    f.homeY = clamp(y + rand(-0.03, 0.03), 0.08, 0.24);
    chooseTargetForFish(f);
    fish.push(f);
  }

  function createDiscus(x, y, scale = 1, spriteSrc = './fish5.png') {
    const el = makeEl(`
      <div class="fish discus">
        <img class="fish-sprite" src="${spriteSrc}" alt="">
      </div>
    `);

    backFishLayer.appendChild(el);

    const f = makeFishBase('discus', el, x, y, scale);
    f.cruiseSpeed = rand(0.000032, 0.000046);
    f.dartSpeed = rand(0.000072, 0.000098);
    f.accel = rand(0.0026, 0.0038);
    f.drag = rand(0.9938, 0.9962);
    f.turnEase = rand(0.022, 0.034);
    f.shyness = rand(0.68, 0.92);
    f.idleBob = rand(0.55, 0.85);
    f.riseCooldown = 0;
    f.homeX = clamp(x + rand(-0.10, 0.10), 0.18, 0.82);
    f.homeY = clamp(y + rand(-0.08, 0.08), 0.34, 0.74);
    chooseTargetForFish(f);
    fish.push(f);
  }

  function createParticle() {
    const el = document.createElement('div');
    el.className = 'particle';
    particlesEl.appendChild(el);

    particles.push({
      el,
      x: Math.random(),
      y: Math.random(),
      vx: (Math.random() - 0.5) * 0.00008,
      vy: -(0.00008 + Math.random() * 0.00012),
      size: isMobile ? 1.8 + Math.random() * 2.0 : 2 + Math.random() * 3,
      drift: Math.random() * 100,
      a: 0.08 + Math.random() * 0.18
    });
  }

  function createBubble(xNorm) {
    const el = document.createElement('div');
    el.className = 'bubble';
    bubblesEl.appendChild(el);

    bubbles.push({
      el,
      x: xNorm,
      y: 1.02 + Math.random() * 0.15,
      vx: (Math.random() - 0.5) * 0.00012,
      vy: 0.00045 + Math.random() * 0.00035,
      size: isMobile ? 4 + Math.random() * 7 : 5 + Math.random() * 10,
      wobble: Math.random() * 100
    });
  }

  function createDiverBubble() {
    const el = document.createElement('div');
    el.className = 'bubble';
    bubblesEl.appendChild(el);

    diverBubbles.push({
      el,
      x: 0.535,
      y: 0.804,
      vx: (Math.random() - 0.5) * 0.00005,
      vy: 0.00028 + Math.random() * 0.00014,
      size: isMobile ? 3.5 + Math.random() * 5 : 4 + Math.random() * 7,
      wobble: Math.random() * 100
    });
  }

  function seedScene() {
    if (ANGEL_COUNT >= 1) {
      createAngel(0.41, 0.23, 0.74, './angel.png', 'left');
    }

    if (ANGEL_COUNT >= 2) {
      createAngel(0.69, 0.27, 0.68, './angel2.png', 'right');
    }

    if (ANGEL_COUNT >= 3) {
      createAngel(0.55, 0.17, 0.64, './angel3.png', 'top');
    }

    const tetraSeedsDesktop = [
      [0.14, 0.55, 0.86],
      [0.24, 0.61, 0.82],
      [0.36, 0.57, 0.88],
      [0.50, 0.64, 0.84],
      [0.64, 0.58, 0.82],
      [0.76, 0.62, 0.86],
      [0.87, 0.56, 0.84],
      [0.43, 0.69, 0.78]
    ];

    const tetraSeedsMobile = [
      [0.16, 0.57, 0.86],
      [0.28, 0.63, 0.82],
      [0.40, 0.59, 0.88],
      [0.52, 0.65, 0.84],
      [0.64, 0.60, 0.82],
      [0.76, 0.64, 0.84],
      [0.24, 0.69, 0.78],
      [0.80, 0.70, 0.80]
    ];

    const seeds = isMobile ? tetraSeedsMobile : tetraSeedsDesktop;

    for (let i = 0; i < Math.min(TETRA_COUNT, seeds.length); i++) {
      const [x, y, s] = seeds[i];
      createTetra(x, y, s);
    }

    if (DISCUS_COUNT >= 1) {
      createDiscus(
        isMobile ? 0.56 : 0.58,
        isMobile ? 0.66 : 0.64,
        isMobile ? 0.82 : 0.88,
        './fish5.png'
      );
    }

    if (BARB_COUNT >= 1) {
      createBarb(
        isMobile ? 0.30 : 0.28,
        isMobile ? 0.62 : 0.60,
        isMobile ? 0.82 : 0.88,
        './barb1.png'
      );
    }

    if (BARB_COUNT >= 2) {
      createBarb(
        isMobile ? 0.70 : 0.72,
        isMobile ? 0.66 : 0.64,
        isMobile ? 0.84 : 0.90,
        './barb2.png'
      );
    }

    if (BARB_COUNT >= 3) {
      createBarb(
        isMobile ? 0.52 : 0.50,
        isMobile ? 0.72 : 0.70,
        isMobile ? 0.86 : 0.92,
        './barb3.png'
      );
    }

    for (let i = 0; i < PARTICLE_COUNT; i++) createParticle();
    for (let i = 0; i < BUBBLE_COUNT; i++) createBubble(0.015 + Math.random() * 0.03);
    for (let i = 0; i < DIVER_BUBBLE_COUNT; i++) createDiverBubble();
  }

  function setMode(mode) {
    currentMode = mode;
    modeBtns.forEach(btn => btn.classList.toggle('active', btn.dataset.mode === mode));

    const r = document.documentElement.style;
    tank.classList.remove('light-wheel');

    if (mode === 'day') {
      r.setProperty('--water-top', '#18485f');
      r.setProperty('--water-mid', '#103547');
      r.setProperty('--water-bottom', '#08141d');
      r.setProperty('--beam-rgb', '255,255,255');
      r.setProperty('--beam-alpha-hi', '.13');
      r.setProperty('--beam-alpha-lo', '0');
      r.setProperty('--shimmer-base', '.34');
      r.setProperty('--mode-sat', '1');
      r.setProperty('--mode-bright', '1');
      r.setProperty('--mode-contrast', '1');
      r.setProperty('--mode-hue', '0deg');
      r.setProperty('--mode-overlay', 'rgba(0,0,0,0)');
      setPresetBeam(191, 230, 255);
    } else if (mode === 'moon') {
      r.setProperty('--water-top', '#0f2745');
      r.setProperty('--water-mid', '#0b1832');
      r.setProperty('--water-bottom', '#040a15');
      r.setProperty('--beam-rgb', '150,190,255');
      r.setProperty('--beam-alpha-hi', '.16');
      r.setProperty('--beam-alpha-lo', '0');
      r.setProperty('--shimmer-base', '.28');
      r.setProperty('--mode-sat', '.90');
      r.setProperty('--mode-bright', '.90');
      r.setProperty('--mode-contrast', '1.05');
      r.setProperty('--mode-hue', '-6deg');
      r.setProperty('--mode-overlay', 'linear-gradient(180deg, rgba(12,20,46,0.10), rgba(8,14,30,0.18))');
      setPresetBeam(155, 188, 255);
    } else if (mode === 'uv') {
      r.setProperty('--water-top', '#241045');
      r.setProperty('--water-mid', '#140c2f');
      r.setProperty('--water-bottom', '#090413');
      r.setProperty('--beam-rgb', '180,100,255');
      r.setProperty('--beam-alpha-hi', '.18');
      r.setProperty('--beam-alpha-lo', '0');
      r.setProperty('--shimmer-base', '.32');
      r.setProperty('--mode-sat', '1.22');
      r.setProperty('--mode-bright', '.98');
      r.setProperty('--mode-contrast', '1.08');
      r.setProperty('--mode-hue', '18deg');
      r.setProperty('--mode-overlay', 'linear-gradient(180deg, rgba(70,20,100,0.10), rgba(25,8,45,0.16))');
      setPresetBeam(180, 100, 255);
    } else if (mode === 'dusk') {
      r.setProperty('--water-top', '#5d3b2a');
      r.setProperty('--water-mid', '#2f2533');
      r.setProperty('--water-bottom', '#120c14');
      r.setProperty('--beam-rgb', '255,174,108');
      r.setProperty('--beam-alpha-hi', '.17');
      r.setProperty('--beam-alpha-lo', '0');
      r.setProperty('--shimmer-base', '.30');
      r.setProperty('--mode-sat', '1.04');
      r.setProperty('--mode-bright', '.96');
      r.setProperty('--mode-contrast', '1.06');
      r.setProperty('--mode-hue', '-4deg');
      r.setProperty('--mode-overlay', 'linear-gradient(180deg, rgba(140,70,30,0.08), rgba(32,12,20,0.15))');
      setPresetBeam(255, 174, 108);
    } else if (mode === 'emerald') {
      r.setProperty('--water-top', '#123d39');
      r.setProperty('--water-mid', '#0c2f2b');
      r.setProperty('--water-bottom', '#071918');
      r.setProperty('--beam-rgb', '120,255,210');
      r.setProperty('--beam-alpha-hi', '.16');
      r.setProperty('--beam-alpha-lo', '0');
      r.setProperty('--shimmer-base', '.30');
      r.setProperty('--mode-sat', '1.12');
      r.setProperty('--mode-bright', '.98');
      r.setProperty('--mode-contrast', '1.07');
      r.setProperty('--mode-hue', '-2deg');
      r.setProperty('--mode-overlay', 'linear-gradient(180deg, rgba(10,60,48,0.08), rgba(5,25,22,0.14))');
      setPresetBeam(120, 255, 210);
    } else if (mode === 'rose') {
      r.setProperty('--water-top', '#3f1539');
      r.setProperty('--water-mid', '#281328');
      r.setProperty('--water-bottom', '#120811');
      r.setProperty('--beam-rgb', '255,120,185');
      r.setProperty('--beam-alpha-hi', '.17');
      r.setProperty('--beam-alpha-lo', '0');
      r.setProperty('--shimmer-base', '.31');
      r.setProperty('--mode-sat', '1.15');
      r.setProperty('--mode-bright', '.97');
      r.setProperty('--mode-contrast', '1.08');
      r.setProperty('--mode-hue', '8deg');
      r.setProperty('--mode-overlay', 'linear-gradient(180deg, rgba(90,20,70,0.08), rgba(26,10,24,0.14))');
      setPresetBeam(255, 120, 185);
    } else if (mode === 'cycle') {
      applyCyclePalette(performance.now());
    }
  }

  let last = performance.now();

  function animate(now) {
    const dt = Math.min(33, now - last);
    const dtSec = dt / 1000;
    last = now;
    const t = now * 0.001;
    if (currentMode === 'cycle') applyCyclePalette(now);
    const tankRect = tank.getBoundingClientRect();
    const mx = mouse.x;
    const my = mouse.y;

    for (const p of particles) {
      p.drift += dt * 0.0007;
      p.x += p.vx * dt + Math.sin(p.drift * 0.5) * 0.00002;
      p.y += p.vy * dt;

      if (p.y < -0.03) {
        p.y = 1.03;
        p.x = Math.random();
      }
      if (p.x < -0.03) p.x = 1.03;
      if (p.x > 1.03) p.x = -0.03;

      p.el.style.width = `${p.size}px`;
      p.el.style.height = `${p.size}px`;
      p.el.style.opacity = p.a + 0.03 * Math.sin(t + p.drift);
      p.el.style.transform = `translate(${p.x * tankRect.width}px, ${p.y * tankRect.height}px)`;
    }

    for (const b of bubbles) {
      b.wobble += dt * 0.0016;
      b.y -= b.vy * dt;
      b.x += b.vx * dt + Math.sin(b.wobble) * 0.00010;

      if (b.y < -0.06) {
        b.y = 1.05 + Math.random() * 0.15;
        b.x = 0.015 + Math.random() * 0.03;
      }

      const s = b.size * (0.96 + 0.06 * Math.sin(b.wobble * 1.4));
      b.el.style.width = `${s}px`;
      b.el.style.height = `${s}px`;
      b.el.style.transform = `translate(${b.x * tankRect.width}px, ${b.y * tankRect.height}px)`;
      b.el.style.opacity = 0.35 + ((1 - b.y) * 0.22);
    }

    for (const b of diverBubbles) {
      b.wobble += dt * 0.0011;
      b.y -= b.vy * dt;
      b.x += b.vx * dt + Math.sin(b.wobble * 1.15) * 0.00008;

      if (b.y < 0.43) {
        b.x = 0.535 + (Math.random() - 0.5) * 0.010;
        b.y = 0.812 + Math.random() * 0.010;
      }

      const s = b.size * (0.95 + 0.08 * Math.sin(b.wobble * 1.5));
      b.el.style.width = `${s}px`;
      b.el.style.height = `${s}px`;
      b.el.style.transform = `translate(${b.x * tankRect.width}px, ${b.y * tankRect.height}px)`;
      b.el.style.opacity = 0.42 + ((1 - b.y) * 0.26);
    }

    const tetraList = fish.filter(f => f.type === 'tetra');
    let tetraCenterX = 0.5;
    let tetraCenterY = 0.60;

    if (tetraList.length) {
      tetraCenterX = tetraList.reduce((s, f) => s + f.x, 0) / tetraList.length;
      tetraCenterY = tetraList.reduce((s, f) => s + f.y, 0) / tetraList.length;
    }

    for (const f of fish) {
      f.stateTimer -= dtSec;
      f.bobT += dtSec * 2.0;

      if (f.stateTimer <= 0) pickState(f);

      const dxm = f.x - mx;
      const dym = f.y - my;
      const dist2 = dxm * dxm + dym * dym;

      let repelX = 0;
      let repelY = 0;

      if (mouse.inside && dist2 < 0.05) {
        const strength = (0.05 - dist2) * 0.015 * f.shyness;
        repelX = dxm * strength;
        repelY = dym * strength;
        if (f.type !== 'discus' && f.state !== 'dart' && dist2 < 0.012) {
          pickState(f, 'dart');
        }
      }

      if (f.type === 'tetra') {
        const schoolMix = 0.12;
        const schoolTargetX = lerp(f.homeX, tetraCenterX, schoolMix);
        const schoolTargetY = lerp(f.homeY, tetraCenterY, schoolMix);
        f.targetX += (schoolTargetX - f.targetX) * 0.0030 * f.wander;
        f.targetY += (schoolTargetY - f.targetY) * 0.0036 * f.wander;
      }

      const tx = f.targetX - f.x;
      const ty = f.targetY - f.y;
      const dist = Math.hypot(tx, ty) || 0.00001;

      if (dist < 0.02 && (f.state === 'cruise' || f.state === 'turn')) {
        if (Math.random() < 0.02) {
          pickState(f, 'idle');
        } else {
          chooseTargetForFish(f);
        }
      }

      let desiredSpeed = 0;
      if (f.state === 'idle') desiredSpeed = f.cruiseSpeed * 0.10;
      if (f.state === 'turn') desiredSpeed = f.cruiseSpeed * 0.55;
      if (f.state === 'cruise') desiredSpeed = f.cruiseSpeed;
      if (f.state === 'dart') desiredSpeed = f.dartSpeed;

      const desiredVX = (tx / dist) * desiredSpeed * FISH_SPEED + repelX;
      const desiredVY = (ty / dist) * desiredSpeed * FISH_SPEED + repelY;

      f.vx = lerp(f.vx, desiredVX, f.accel);
      f.vy = lerp(f.vy, desiredVY, f.accel);

      if (f.state === 'idle') {
        f.vx *= 0.992;
        f.vy *= 0.992;
      } else {
        f.vx *= f.drag;
        f.vy *= f.drag;
      }

      const intentX = Math.abs(tx) > 0.01 ? tx : desiredVX;
      const desiredDir = intentX >= 0 ? 1 : -1;
      const dirResponse = f.type === 'angel' ? 0.10 : (f.type === 'discus' ? 0.085 : (f.type === 'barb' ? 0.13 : 0.16));
      f.turnMomentum = lerp(f.turnMomentum, desiredDir, dirResponse);

      if (f.turnMomentum > 0.08) f.dir = 1;
      if (f.turnMomentum < -0.08) f.dir = -1;

      if (f.dir === 1 && f.vx < 0) f.vx *= 0.35;
      if (f.dir === -1 && f.vx > 0) f.vx *= 0.35;

      f.x += f.vx * dt;
      f.y += f.vy * dt;

      if (f.type === 'angel') {
        f.x = clamp(f.x, 0.05, 0.95);
        f.y = clamp(f.y, 0.04, 0.32);
      } else if (f.type === 'tetra') {
        f.x = clamp(f.x, 0.06, 0.94);
        f.y = clamp(f.y, 0.34, 0.82);
      } else if (f.type === 'discus') {
        f.x = clamp(f.x, 0.08, 0.92);
        f.y = clamp(f.y, 0.12, 0.86);
      } else if (f.type === 'barb') {
        f.x = clamp(f.x, 0.05, 0.95);
        f.y = clamp(f.y, 0.50, 0.90);
      }

      const displayVX = Math.max(Math.abs(f.vx), Math.abs(desiredVX) * 0.65, 0.00001) * f.dir;
      const moveAngle = Math.atan2(f.vy, displayVX);
      f.angle = lerp(f.angle, moveAngle, f.turnEase);

      const speedMag = Math.hypot(f.vx, f.vy);

      const tailBoost =
        f.state === 'dart' ? 2.0 :
        f.state === 'cruise' ? 1.0 :
        f.state === 'turn' ? 0.7 : 0.35;

      const bodyBob =
        f.state === 'idle'
          ? Math.sin(f.bobT * 1.5 + f.schoolPhase) * 0.0012 * f.idleBob
          : Math.sin(f.bobT * 1.8 + f.schoolPhase) * 0.0008 * f.idleBob;

      const extraSchoolY = f.type === 'tetra'
        ? Math.sin(t * 0.7 + f.schoolPhase) * 0.0014
        : 0;

      const drawY = f.y + bodyBob + extraSchoolY + f.depthOffset;
      const rotDeg = (f.angle * 180 / Math.PI) * (f.type === 'discus' ? 0.22 : (f.type === 'barb' ? 0.28 : 0.33));
      const tailDeg = Math.sin(t * 10 * tailBoost + f.schoolPhase * 2) * (speedMag * (f.type === 'discus' ? 6400 : (f.type === 'barb' ? 7600 : 9000)));
      const finalRot = rotDeg + clamp(tailDeg, f.type === 'discus' ? -5 : (f.type === 'barb' ? -6 : -8), f.type === 'discus' ? 5 : (f.type === 'barb' ? 6 : 8));

      const spriteFacing = f.nativeFacing ?? ((f.type === 'angel' || f.type === 'discus') ? -1 : 1);
      f.el.style.opacity = f.type === 'tetra' ? '0.96' : (f.type === 'discus' ? '0.98' : (f.type === 'barb' ? '0.97' : '1'));
      const drawScale = f.scale * FISH_SIZE_MULTIPLIER;
      f.el.style.transform =
        `translate(${f.x * tankRect.width}px, ${drawY * tankRect.height}px) translate(-50%,-50%) scale(${spriteFacing * f.dir * drawScale}, ${drawScale}) rotate(${finalRot}deg)`;
    }

    requestAnimationFrame(animate);
  }

  function updatePointerFromClient(clientX, clientY) {
    const r = tank.getBoundingClientRect();
    mouse.x = clamp((clientX - r.left) / r.width, 0, 1);
    mouse.y = clamp((clientY - r.top) / r.height, 0, 1);
    mouse.inside = true;
  }

  tank.addEventListener('mousemove', (e) => {
    updatePointerFromClient(e.clientX, e.clientY);
  });

  tank.addEventListener('mouseleave', () => {
    mouse.inside = false;
    mouse.x = 0.5;
    mouse.y = 0.5;
  });

  tank.addEventListener('touchstart', (e) => {
    const touch = e.touches[0];
    if (touch) updatePointerFromClient(touch.clientX, touch.clientY);
  }, { passive:true });

  tank.addEventListener('touchmove', (e) => {
    const touch = e.touches[0];
    if (touch) updatePointerFromClient(touch.clientX, touch.clientY);
  }, { passive:true });

  tank.addEventListener('touchend', () => {
    mouse.inside = false;
    mouse.x = 0.5;
    mouse.y = 0.5;
  }, { passive:true });

  modeBtns.forEach(btn => {
    btn.addEventListener('click', () => setMode(btn.dataset.mode));
  });

  lightIntensity.addEventListener('input', (e) => {
    applyLightIntensity(e.target.value);
  });

  cycleSpeed.addEventListener('input', (e) => {
    applyCycleSpeed(e.target.value);
    if (currentMode === 'cycle') applyCyclePalette(performance.now());
  });

  seedScene();
  setMode('day');
  applyLightIntensity(lightIntensity.value);
  applyCycleSpeed(cycleSpeed.value);
  requestAnimationFrame(animate);
})();
</script>
</body>
