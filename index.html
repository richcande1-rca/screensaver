

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Ambient Aquarium Prototype</title>
<style>
:root{
  --bg:#05070b;
  --tank-w:min(62vw, 560px);
  --tank-h:min(86vh, 920px);

  --water-top:#18485f;
  --water-mid:#103547;
  --water-bottom:#08141d;

  --glass-border:rgba(255,255,255,0.12);
  --glass-highlight:rgba(255,255,255,0.08);
  --glass-shadow:rgba(0,0,0,0.45);

  --beam-a:rgba(255,255,255,0.13);
  --beam-b:rgba(255,255,255,0.00);
  --beam-rgb:255,255,255;
  --beam-alpha-hi:.13;
  --beam-alpha-lo:0;
  --light-intensity:1;
  --wheel-speed:10s;
  --wheel-play:running;
  --shimmer-base:.34;

  --tank-glow:rgba(90,170,220,0.20);
  --ui-bg:rgba(10,14,18,0.72);
  --ui-border:rgba(255,255,255,0.10);
  --ui-text:#d8e7ef;

  --particle:rgba(230,245,255,0.18);
  --bubble:rgba(230,247,255,0.45);

  --fish-glow:drop-shadow(0 0 8px rgba(120,220,255,0.15));

  --mode-sat:1;
  --mode-bright:1;
  --mode-contrast:1;
  --mode-hue:0deg;
  --mode-overlay:rgba(0,0,0,0);

  --photo-blur:0px;
  --diver-blur:.12px;
  --shimmer-opacity:.34;
  --ripple-display:block;
  --ripple-opacity:.14;

  --bg-mobile-image:url("./aquarium-bg.png");
  --bg-desktop-image:url("./BG2.png");
}

*{box-sizing:border-box}

html,body{
  margin:0;
  height:100%;
  background:
    radial-gradient(circle at 50% 45%, rgba(20,35,55,0.22), transparent 40%),
    radial-gradient(circle at 50% 50%, rgba(0,0,0,0.15), transparent 50%),
    linear-gradient(180deg, #05070b 0%, #020305 100%);
  overflow:hidden;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  color:var(--ui-text);
}

body{
  display:grid;
  place-items:center;
}

.stage{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
}

.room-vignette{
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(circle at 50% 50%, transparent 18%, rgba(0,0,0,0.10) 55%, rgba(0,0,0,0.60) 100%),
    radial-gradient(circle at 50% 50%, rgba(80,170,210,0.06), transparent 24%);
}

.tank-wrap{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:var(--tank-w);
  height:var(--tank-h);
  display:flex;
  align-items:center;
  justify-content:center;
  filter:
    drop-shadow(0 18px 50px rgba(0,0,0,0.55))
    drop-shadow(0 0 35px var(--tank-glow));
}

.tank{
  position:relative;
  width:100%;
  height:100%;
  overflow:hidden;
  border-radius:26px;
  border:1px solid var(--glass-border);
  background:
    linear-gradient(180deg,
      color-mix(in srgb, var(--water-top) 94%, white 6%) 0%,
      var(--water-mid) 38%,
      var(--water-bottom) 100%);
  box-shadow:
    inset 0 1px 0 var(--glass-highlight),
    inset 0 -30px 80px rgba(0,0,0,0.25),
    inset 24px 0 50px rgba(0,0,0,0.12),
    inset -24px 0 50px rgba(0,0,0,0.12),
    0 18px 40px var(--glass-shadow);
  isolation:isolate;
  filter:
    saturate(var(--mode-sat))
    brightness(var(--mode-bright))
    contrast(var(--mode-contrast))
    hue-rotate(var(--mode-hue));
}

.tank::before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(90deg,
      rgba(255,255,255,0.06) 0%,
      rgba(255,255,255,0.015) 8%,
      transparent 18%,
      transparent 82%,
      rgba(255,255,255,0.015) 92%,
      rgba(255,255,255,0.055) 100%);
  mix-blend-mode:screen;
  z-index:50;
}

.tank::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:var(--mode-overlay);
  z-index:49;
}

.layer{
  position:absolute;
  inset:0;
  pointer-events:none;
}

.photo-bg{
  z-index:1;
  background:
    linear-gradient(180deg, rgba(0,0,0,0.10), rgba(0,0,0,0.24)),
    var(--bg-mobile-image) center center / cover no-repeat;
  filter:
    saturate(.92)
    brightness(.78)
    contrast(1.02)
    blur(var(--photo-blur));
  transform:scale(1.03);
  opacity:.92;
}

.back-haze{
  z-index:2;
  background:
    radial-gradient(circle at 50% 35%, rgba(160,220,255,0.09), transparent 26%),
    radial-gradient(circle at 26% 48%, rgba(120,220,180,0.05), transparent 22%),
    radial-gradient(circle at 75% 55%, rgba(120,220,180,0.04), transparent 26%);
  opacity:.9;
  animation:hazeDrift 18s ease-in-out infinite alternate;
}

.light-beams{
  z-index:3;
  overflow:hidden;
  mix-blend-mode:screen;
  opacity:.95;
}

.beam{
  position:absolute;
  top:-10%;
  width:18%;
  height:70%;
  background:linear-gradient(
    180deg,
    rgba(var(--beam-rgb), calc(var(--beam-alpha-hi) * var(--light-intensity))),
    rgba(var(--beam-rgb), calc(var(--beam-alpha-lo) * var(--light-intensity)))
  );
  filter:blur(var(--beam-blur, 8px));
  transform-origin:top center;
  opacity:.86;
  animation:beamSway 10s ease-in-out infinite alternate;
}

.beam.b1{ left:20%; transform:rotate(-10deg); animation-duration:13s; }
.beam.b2{ left:39%; transform:rotate(-3deg); animation-duration:11s; opacity:.55; }
.beam.b3{ left:56%; transform:rotate(7deg); animation-duration:15s; opacity:.48; }

.light-shimmer{
  z-index:4;
  left:0;
  top:0;
  width:100%;
  height:44%;
  opacity:calc(var(--shimmer-base) * var(--light-intensity));
  mix-blend-mode:screen;
  overflow:hidden;
  -webkit-mask-image:linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,.95) 38%, rgba(0,0,0,.45) 72%, rgba(0,0,0,0) 100%);
  mask-image:linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,.95) 38%, rgba(0,0,0,.45) 72%, rgba(0,0,0,0) 100%);
}

.light-shimmer::before{
  content:"";
  position:absolute;
  inset:-8% -20%;
  background:
    repeating-linear-gradient(
      103deg,
      rgba(255,255,255,0.00) 0px,
      rgba(255,255,255,0.00) 18px,
      rgba(255,255,255,0.20) 28px,
      rgba(255,255,255,0.08) 38px,
      rgba(255,255,255,0.00) 54px,
      rgba(255,255,255,0.00) 78px
    ),
    repeating-linear-gradient(
      79deg,
      rgba(180,220,255,0.00) 0px,
      rgba(180,220,255,0.12) 16px,
      rgba(180,220,255,0.00) 34px,
      rgba(255,255,255,0.10) 48px,
      rgba(255,255,255,0.00) 72px
    );
  filter:blur(var(--shimmer-blur, 1.5px));
  transform:translateX(0) translateY(0) scale(1.04);
  animation:topShimmerMove 4.8s linear infinite;
}

.wheel-spectrum{
  z-index:5;
  opacity:0;
  overflow:hidden;
  mix-blend-mode:screen;
  transition:opacity .35s ease;
  -webkit-mask-image:linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,.96) 38%, rgba(0,0,0,.52) 72%, rgba(0,0,0,0) 100%);
  mask-image:linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,.96) 38%, rgba(0,0,0,.52) 72%, rgba(0,0,0,0) 100%);
}

.wheel-spectrum::before{
  content:"";
  position:absolute;
  inset:-34% -30% -22% -30%;
  border-radius:50%;
  background:conic-gradient(
    from 0deg,
    rgba(255,82,112,0.00) 0deg,
    rgba(255,82,112,0.95) 38deg,
    rgba(255,176,74,0.95) 82deg,
    rgba(255,233,96,0.92) 122deg,
    rgba(98,255,168,0.90) 170deg,
    rgba(82,235,255,0.90) 220deg,
    rgba(100,132,255,0.92) 270deg,
    rgba(214,96,255,0.94) 322deg,
    rgba(255,82,112,0.95) 360deg
  );
  filter:blur(var(--wheel-core-blur, 46px)) saturate(1.15) brightness(1.06);
  transform-origin:50% 42%;
  animation:wheelSpin var(--wheel-speed) linear infinite;
  animation-play-state:var(--wheel-play);
}

.wheel-spectrum::after{
  content:"";
  position:absolute;
  inset:-2% -28% 32% -28%;
  background:linear-gradient(
    90deg,
    rgba(255,92,120,0.00) 0%,
    rgba(255,92,120,0.38) 12%,
    rgba(255,182,86,0.36) 24%,
    rgba(255,239,110,0.34) 36%,
    rgba(98,255,170,0.34) 50%,
    rgba(86,232,255,0.34) 64%,
    rgba(110,136,255,0.36) 78%,
    rgba(220,100,255,0.38) 90%,
    rgba(255,92,120,0.00) 100%
  );
  background-size:220% 100%;
  filter:blur(var(--wheel-sweep-blur, 20px)) saturate(1.12) brightness(1.05);
  animation:wheelSweep var(--wheel-sweep-speed) linear infinite;
  animation-play-state:var(--wheel-play);
}

.tank.light-wheel .wheel-spectrum{
  opacity:calc(.88 * var(--light-intensity));
}

.tank.light-wheel .light-beams{
  opacity:1;
}

.tank.light-wheel .beam{
  width:20%;
  height:78%;
  opacity:.96;
  filter:blur(6px) saturate(1.10);
}

.tank.light-wheel .light-shimmer{
  opacity:calc((var(--shimmer-base) + .18) * var(--light-intensity));
}

.tank.light-wheel .beam.b1{ left:14%; }
.tank.light-wheel .beam.b2{ left:39%; opacity:.80; }
.tank.light-wheel .beam.b3{ left:64%; opacity:.72; }

.diver-layer{
  z-index:6;
  pointer-events:none;
}

.diver-ornament{
  position:absolute;
  left:53%;
  bottom:11.2%;
  width:12.4%;
  max-width:70px;
  opacity:.90;
  filter:
    saturate(.88)
    brightness(.93)
    contrast(1.12)
    blur(var(--diver-blur))
    drop-shadow(0 2px 6px rgba(0,0,0,0.24))
    drop-shadow(0 0 4px rgba(190,220,235,0.10));
  transform:translateX(-50%);
  transform-origin:50% 85%;
}

.diver-fade{
  z-index:7;
  pointer-events:none;
  background:
    radial-gradient(
      circle at 53% 77%,
      rgba(70,150,210,0.00) 0%,
      rgba(70,150,210,0.00) 6%,
      rgba(70,150,210,0.06) 12%,
      rgba(40,110,180,0.10) 18%,
      rgba(20,60,120,0.06) 26%,
      rgba(0,0,0,0.00) 38%
    );
  mix-blend-mode:screen;
  opacity:.26;
  filter:blur(4px);
}

.particles,
.bubbles,
.fish-layer{
  z-index:9;
}

.fish-back-layer{
  z-index:5;
}

.crab-layer{
  z-index:8;
  overflow:hidden;
}

.crab{
  position:absolute;
  left:0;
  top:0;
  width:clamp(52px, 6.8vw, 96px);
  opacity:.98;
  will-change:transform, opacity;
  transform:translate3d(0,0,0);
  transform-origin:50% 100%;
  backface-visibility:hidden;
  filter:
    drop-shadow(0 2px 5px rgba(0,0,0,0.28))
    drop-shadow(0 0 4px rgba(0,0,0,0.12));
}

.foreground-plants{
  z-index:16;
  overflow:hidden;
}

.fg-plant{
  position:absolute;
  bottom:-6.5%;
  width:12%;
  transform-origin:50% 100%;
  opacity:.44;
  filter:none;
  animation:fgPlantSway 8s ease-in-out infinite alternate;
}

.fg-plant img{
  display:block;
  width:100%;
  height:auto;
  pointer-events:none;
  user-select:none;
  -webkit-user-drag:none;
}

.fg1{
  left:4%;
  width:22%;
  bottom:-7.8%;
  animation-duration:9.2s;
  animation-delay:-1.8s;
  opacity:.50;
}

.fg2{
  left:33%;
  width:24%;
  bottom:-16.2%;
  animation-duration:8.4s;
  animation-delay:-2.6s;
  opacity:.60;
}

.fg4{
  left:54%;
  width:29%;
  bottom:-10.8%;
  animation-duration:7.9s;
  animation-delay:-1.1s;
  opacity:1;
  z-index:8;
  filter:drop-shadow(0 2px 6px rgba(0,0,0,0.22));
}

.fg3{
  right:-2%;
  width:24%;
  bottom:-9.2%;
  animation-duration:10.1s;
  animation-delay:-3.3s;
  opacity:.48;
}

.hero-plant{
  z-index:2;
}

.mid-plant{
  z-index:3;
}

.accent-plant{
  z-index:4;
}

.right-plant{
  z-index:2;
}

.ripple{
  z-index:20;
  display:var(--ripple-display);
  opacity:var(--ripple-opacity);
  mix-blend-mode:screen;
  background:
    repeating-linear-gradient(
      100deg,
      rgba(255,255,255,0.18) 0px,
      rgba(255,255,255,0.06) 6px,
      rgba(255,255,255,0.00) 20px,
      rgba(255,255,255,0.05) 34px,
      rgba(255,255,255,0.00) 54px
    );
  filter:blur(8px);
  animation:rippleShift 11s linear infinite;
}

.glass-reflection{
  z-index:30;
  background:
    linear-gradient(112deg,
      transparent 0%,
      transparent 58%,
      rgba(255,255,255,0.06) 66%,
      rgba(255,255,255,0.00) 74%,
      transparent 82%);
  opacity:.75;
}

.particle{
  position:absolute;
  width:4px;
  height:4px;
  border-radius:50%;
  background:var(--particle);
  filter:blur(.2px);
  will-change:transform, opacity;
  transform:translate3d(0,0,0);
  backface-visibility:hidden;
}

.bubble{
  position:absolute;
  width:10px;
  height:10px;
  border-radius:50%;
  border:1.4px solid rgba(255,255,255,0.58);
  background:radial-gradient(circle at 34% 32%, rgba(255,255,255,0.82), rgba(210,242,255,0.20) 44%, rgba(255,255,255,0.06) 62%, transparent 72%);
  box-shadow:inset -1px -1px 4px rgba(255,255,255,0.30), 0 0 8px rgba(210,242,255,0.22);
  opacity:.7;
  will-change:transform, opacity;
  transform:translate3d(0,0,0);
  backface-visibility:hidden;
}

.fish{
  position:absolute;
  will-change:transform;
  transform:translate3d(0,0,0);
  backface-visibility:hidden;
  filter:var(--fish-filter, var(--fish-glow));
}

/* ----------------------------------------------------
   STABLE FISH DEPTH SHADOWS
   Shadows are now separate flat elements in the fish layer.
   They follow position/depth only, while the fish sprite can
   flip, compress, lean, and rotate above them.
---------------------------------------------------- */
.fish::before{
  display:none;
}

.fish-shadow{
  position:absolute;
  left:0;
  top:0;
  width:var(--shadow-w, 100px);
  height:var(--shadow-h, 32px);
  border-radius:999px;
  background:radial-gradient(
    ellipse at center,
    rgba(0,0,0,0.54) 0%,
    rgba(0,0,0,0.32) 34%,
    rgba(48,92,112,0.20) 55%,
    rgba(135,205,225,0.10) 72%,
    rgba(0,0,0,0.00) 88%
  );
  opacity:.38;
  filter:blur(5.2px);
  pointer-events:none;
  will-change:transform, opacity, filter;
  transform:translate3d(-9999px,-9999px,0);
  transform-origin:center center;
  backface-visibility:hidden;
}

.fish-shadow-tetra{ --shadow-w:69px; --shadow-h:13px; }
.fish-shadow-angel{ --shadow-w:121px; --shadow-h:56px; }
.fish-shadow-discus{ --shadow-w:108px; --shadow-h:36px; }
.fish-shadow-barb{ --shadow-w:79px; --shadow-h:16px; }

@media (max-width: 800px){
  .fish-shadow-tetra{ --shadow-w:61px; --shadow-h:11px; }
  .fish-shadow-angel{ --shadow-w:111px; --shadow-h:52px; }
  .fish-shadow-discus{ --shadow-w:100px; --shadow-h:33px; }
  .fish-shadow-barb{ --shadow-w:69px; --shadow-h:14px; }
}

.fish-sprite{
  position:absolute;
  display:block;
  width:100%;
  height:100%;
  object-fit:contain;
  pointer-events:none;
  user-select:none;
  -webkit-user-drag:none;
  image-rendering:auto;
  background:transparent;
  z-index:1;
  filter:var(--fish-sprite-filter, drop-shadow(0 0 8px rgba(120,220,255,0.10)));
}

.fish.has-discus-tail-replacement .fish-sprite{
  clip-path:polygon(0% 0%, 76% 0%, 76% 100%, 0% 100%);
  inset:4px;
  width:calc(100% - 8px);
  height:calc(100% - 8px);
}

.tetra{
  width:52px;
  height:28px;
}

.angel{
  width:92px;
  height:128px;
}

.discus{
  width:82px;
  height:82px;
}

.barb{
  width:60px;
  height:34px;
}


/* ----------------------------------------------------
   ANGEL + BARB TAIL TEST
   Same trick as the discus: clip the static sprite before
   the tail, then overlay a small animated tail slice from
   the same PNG. No extra fish added.
---------------------------------------------------- */
.fish.has-tail-replacement .fish-sprite{
  clip-path:var(--tail-body-clip, polygon(0% 0%, 78% 0%, 78% 100%, 0% 100%));
}

.fish-tail{
  position:absolute;
  inset:0;
  z-index:2;
  pointer-events:none;
  user-select:none;
  -webkit-user-drag:none;
  background:var(--fish-src) center center / contain no-repeat;
  opacity:.98;
  filter:blur(.03px) saturate(1.02) brightness(1.02);
  will-change:transform;
  backface-visibility:hidden;
}

.angel-tail{
  clip-path:polygon(56% 8%, 100% 0%, 100% 100%, 56% 92%);
  transform-origin:61% 50%;
  animation:angelTailWag var(--tail-speed, 1700ms) cubic-bezier(.45,.05,.55,.95) infinite;
}

.barb-tail{
  clip-path:polygon(56% 14%, 100% 16%, 100% 84%, 56% 86%);
  transform-origin:61% 50%;
  animation:barbTailWag var(--tail-speed, 1180ms) cubic-bezier(.45,.05,.55,.95) infinite;
}

@keyframes angelTailWag{
  0%{
    transform:translate3d(var(--tail-x-a, .22%),0,0) scaleX(var(--tail-scale-a, .972)) skewY(var(--tail-skew-a, -.80deg)) rotate(var(--tail-rot-a, -.32deg));
  }
  50%{
    transform:translate3d(var(--tail-x-b, -.22%),0,0) scaleX(var(--tail-scale-b, 1.028)) skewY(var(--tail-skew-b, .80deg)) rotate(var(--tail-rot-b, .32deg));
  }
  100%{
    transform:translate3d(var(--tail-x-a, .22%),0,0) scaleX(var(--tail-scale-a, .972)) skewY(var(--tail-skew-a, -.80deg)) rotate(var(--tail-rot-a, -.32deg));
  }
}

@keyframes barbTailWag{
  0%{
    transform:translate3d(var(--tail-x-a, .30%),0,0) scaleX(var(--tail-scale-a, .955)) skewY(var(--tail-skew-a, -1.25deg)) rotate(var(--tail-rot-a, -.55deg));
  }
  50%{
    transform:translate3d(var(--tail-x-b, -.30%),0,0) scaleX(var(--tail-scale-b, 1.045)) skewY(var(--tail-skew-b, 1.25deg)) rotate(var(--tail-rot-b, .55deg));
  }
  100%{
    transform:translate3d(var(--tail-x-a, .30%),0,0) scaleX(var(--tail-scale-a, .955)) skewY(var(--tail-skew-a, -1.25deg)) rotate(var(--tail-rot-a, -.55deg));
  }
}

html.perf-lite .fish-tail{
  filter:none;
}

html.perf-lite .fish::before{
  filter:blur(var(--fish-shadow-blur, 4px));
  opacity:calc(var(--fish-shadow-opacity, .34) + .10);
}

/* ----------------------------------------------------
   DISCUS FIN TEST
   Lightweight fake fin movement using tiny clipped overlays
   from the same discus PNG. This keeps the discus as one fish,
   with only a few child layers on the single big fish.
---------------------------------------------------- */
.discus{
  --fin-speed:1600ms;
  --fin-speed-tail:1450ms;
  --fin-wag:1.0;
  --tail-x-a:.42%;
  --tail-x-b:-.42%;
  --tail-scale-a:.925;
  --tail-scale-b:1.075;
  --tail-skew-a:-1.55deg;
  --tail-skew-b:1.55deg;
  --tail-rot-a:-.62deg;
  --tail-rot-b:.62deg;
}

.discus .fish-sprite{
  z-index:1;
}

.discus-fin{
  position:absolute;
  inset:4px;
  z-index:2;
  pointer-events:none;
  user-select:none;
  -webkit-user-drag:none;
  background:var(--fish-src) center center / contain no-repeat;
  opacity:.0;
  mix-blend-mode:normal;
  filter:blur(.04px) saturate(1.03) brightness(1.03);
  will-change:transform, opacity;
  backface-visibility:hidden;
}

.discus-fin-top{
  display:none;
}

.discus-fin-bottom{
  display:none;
}

.discus-fin-tail{
  clip-path:polygon(56% 18%, 99% 16%, 99% 86%, 56% 82%);
  transform-origin:62% 51%;
  opacity:.98;
  mix-blend-mode:normal;
  animation:discusTailFin var(--fin-speed-tail, 1450ms) cubic-bezier(.45,.05,.55,.95) infinite;
  animation-delay:0ms;

  }
  25%{
    transform:translate3d(0,0,0) scaleX(1.0) skewY(0deg) rotate(0deg);

  }
  50%{
    transform:translate3d(var(--tail-x-b),0,0) scaleX(var(--tail-scale-b)) skewY(var(--tail-skew-b)) rotate(var(--tail-rot-b));
    opacity:.99;
  }
  75%{
    transform:translate3d(0,0,0) scaleX(1.0) skewY(0deg) rotate(0deg);
    opacity:.985;
  }
  100%{
    transform:translate3d(var(--tail-x-a),0,0) scaleX(var(--tail-scale-a)) skewY(var(--tail-skew-a)) rotate(var(--tail-rot-a));
    opacity:.96;
  }

.controls{
  position:fixed;
  left:50%;
  bottom:calc(12px + env(safe-area-inset-bottom, 0px));
  transform:translateX(-50%);
  z-index:1000;
  display:flex;
  flex-direction:column;
  gap:8px;
  align-items:stretch;
  justify-content:center;
  padding:10px;
  min-width:min(92vw, 720px);
  border:1px solid var(--ui-border);
  border-radius:18px;
  background:var(--ui-bg);
  backdrop-filter:blur(var(--controls-blur, 8px));
  box-shadow:0 10px 30px rgba(0,0,0,0.35);
  pointer-events:auto;
  transition:opacity .22s ease, transform .22s ease;
}

.controlsToggle{
  position:fixed;
  right:max(12px, env(safe-area-inset-right, 0px));
  bottom:calc(12px + env(safe-area-inset-bottom, 0px));
  z-index:1002;
  appearance:none;
  border:1px solid rgba(191,230,255,0.24);
  background:rgba(10,14,18,0.72);

  border-radius:999px;
  font-size:12px;
  font-weight:700;
  letter-spacing:.08em;
  text-transform:uppercase;
  backdrop-filter:blur(var(--controls-blur, 8px));
  box-shadow:0 8px 24px rgba(0,0,0,0.28);
  cursor:pointer;
  touch-action:manipulation;
  transition:background .18s ease, transform .18s ease, border-color .18s ease, opacity .18s ease;
}

.controlsToggle:hover{
  background:rgba(22,28,38,0.88);
  transform:translateY(-1px);
}

.controlsToggle.is-open{
  background:rgba(120,210,255,0.16);

<body class="controls-collapsed">
<div class="stage" id="stage">
  <div class="room-vignette"></div>

  <div class="tank-wrap">
    <div class="tank" id="tank">
      <div class="layer photo-bg"></div>
      <div class="layer back-haze"></div>

      <div class="layer light-beams">
        <div class="beam b1"></div>
        <div class="beam b2"></div>
        <div class="beam b3"></div>
      </div>

      <div class="layer light-shimmer"></div>
      <div class="layer wheel-spectrum"></div>

      <div class="layer fish-back-layer" id="backFishLayer"></div>

      <div class="layer diver-layer">
        <img src="./diver.png" alt="" class="diver-ornament" id="diverOrnament">
      </div>

      <div class="layer diver-fade"></div>
      <div class="layer crab-layer" id="crabLayer"></div>

      <div class="layer particles" id="particles"></div>
      <div class="layer bubbles" id="bubbles"></div>
      <div class="layer fish-layer" id="fishLayer"></div>

        <div class="fg-plant fg1 hero-plant"><img src="./plant1.png" alt=""></div>
        <div class="fg-plant fg2 mid-plant"><img src="./plant2.png" alt=""></div>
        <div class="fg-plant fg4 accent-plant"><img src="./plant4.png" alt=""></div>

    <div class="control-row">
      <label class="sliderWrap" for="swimSpeed">
        <span>Speed</span>
        <input type="range" id="swimSpeed" min="0" max="100" value="20" />
        <span id="swimSpeedValue">100%</span>
      </label>
      <label class="sliderWrap" for="bubbleIntensity">
        <span>Bubbles</span>
        <input type="range" id="bubbleIntensity" min="0" max="100" value="25" />
        <span id="bubbleIntensityValue">100%</span>
      </label>
      <label class="sliderWrap" for="bubbleVolume">
        <span>Volume</span>
        <input type="range" id="bubbleVolume" min="0" max="100" value="100" />
        <span id="bubbleVolumeValue">100%</span>

  <div class="radioDock" id="radioDock" aria-hidden="true">
    <section class="radioPanel" aria-label="Aquarium radio controls">
      <div class="radioTitle">
        <span class="radioTitleText">Aquarium Radio</span>
        <span class="radioStatus" id="radioStatus">idle</span>
        <button class="radioClose" id="radioCloseBtn" type="button" aria-label="Hide radio">×</button>
      </div>
      <div class="radioControlsGroup">
        <input class="radioInput" id="radioUrlInput" type="url" inputmode="url" spellcheck="false" aria-label="YouTube URL" placeholder="Paste YouTube link..." />
        <div class="radioSearchLabel">YouTube Search</div>
        <div class="radioSearchRow">
          <input class="radioSearchInput" id="radioSearchInput" type="search" inputmode="search" spellcheck="false" aria-label="Search YouTube" placeholder="Search YouTube..." />
          <button class="radioSearchBtn" type="button" id="radioSearchBtn">Find on YouTube</button>
        </div>
        <div class="radioButtons">
          <button type="button" id="radioPlayBtn">Play URL</button>
          <button type="button" id="radioDefaultBtn">Default</button>
          <button type="button" id="radioHideBtn">Hide Dial</button>
          <button type="button" id="radioStopBtn">Stop</button>
        </div>
        <p class="radioHelp">Paste a YouTube link above to play it here. Use search to open YouTube results in a new tab, then copy a video link back here.</p>
      </div>
      <div class="radioPlayerWrap" id="radioPlayerWrap">
        <iframe id="radioPlayerFrame" title="YouTube aquarium radio" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
      </div>
    </section>
  </div>
</div>

<script>
(() => {
  const tank = document.getElementById('tank');
  const stage = document.getElementById('stage');
  const fishLayer = document.getElementById('fishLayer');
  const backFishLayer = document.getElementById('backFishLayer');
  const particlesEl = document.getElementById('particles');
  const bubblesEl = document.getElementById('bubbles');
  const crabLayer = document.getElementById('crabLayer');
  const titleEl = document.getElementById('appTitle');
  const lightModeBtn = document.getElementById('lightModeBtn');
  const swimSpeed = document.getElementById('swimSpeed');
  const swimSpeedValue = document.getElementById('swimSpeedValue');
  const bubbleIntensity = document.getElementById('bubbleIntensity');
  const bubbleIntensityValue = document.getElementById('bubbleIntensityValue');
  const bubbleVolume = document.getElementById('bubbleVolume');
  const bubbleVolumeValue = document.getElementById('bubbleVolumeValue');
  const controlsToggle = document.getElementById('controlsToggle');
  const controlsPanel = document.getElementById('controlsPanel');
  const bgToggleBtn = document.getElementById('bgToggleBtn');
  const bubbleSoundBtn = document.getElementById('bubbleSoundBtn');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  const radioToggleBtn = document.getElementById('radioToggleBtn');
  const radioDock = document.getElementById('radioDock');
  const radioCloseBtn = document.getElementById('radioCloseBtn');
  const radioUrlInput = document.getElementById('radioUrlInput');
  const radioSearchInput = document.getElementById('radioSearchInput');
  const radioSearchBtn = document.getElementById('radioSearchBtn');
  const radioPlayBtn = document.getElementById('radioPlayBtn');
  const radioDefaultBtn = document.getElementById('radioDefaultBtn');
  const radioHideBtn = document.getElementById('radioHideBtn');
  const radioStopBtn = document.getElementById('radioStopBtn');
  const radioStatus = document.getElementById('radioStatus');
  const radioPlayerWrap = document.getElementById('radioPlayerWrap');
  const radioPlayerFrame = document.getElementById('radioPlayerFrame');
  const rootEl = document.documentElement;

  const FIXED_CYCLE_SPEED = 50;

  const isMobile = window.matchMedia('(max-width: 800px)').matches;

  const CONTROLS_STORAGE_KEY = 'ambientAquarium.controlsOpen.v2';
  const BUBBLE_SOUND_STORAGE_KEY = 'ambientAquarium.bubbleSoundEnabled.v1';
  const BUBBLE_VOLUME_STORAGE_KEY = 'ambientAquarium.bubbleVolume.v1';
  const BG_SET_STORAGE_KEY = 'ambientAquarium.bgSet.v1';
  const RADIO_URL_STORAGE_KEY = 'ambientAquarium.radioUrl.v1';
  const DEFAULT_RADIO_URL = 'https://www.youtube.com/watch?v=bitGzQcK4w4';

  const BG_SETS = [
    {
      id: 'classic',
      label: 'Classic',
      mobile: './aquarium-bg.png',
      desktop: './BG2.png'
    },
    {
      id: 'rocky',
      label: 'Rocky',
      mobile: './bg2.png',
      desktop: './bg2.1.png'
    },
    {
      id: 'sandy',
      label: 'Sandy',
      mobile: './bg3.png',
      desktop: './bg3.2.png'
    }
  ];

  let currentBgSetId = 'classic';

  const LIGHT_MODE_ORDER = ['day', 'moon', 'uv', 'dusk', 'emerald', 'rose', 'cycle'];
  const LIGHT_MODE_LABELS = {
    day: 'Day',
    moon: 'Moon',
    uv: 'UV',
    dusk: 'Dusk',
    emerald: 'Emerald',
    rose: 'Rose',
    cycle: 'Cycle'
  };

  function setControlsOpen(open) {
    document.body.classList.toggle('controls-open', open);
    document.body.classList.toggle('controls-collapsed', !open);
    if (controlsToggle) {
      controlsToggle.classList.toggle('is-open', open);
      controlsToggle.setAttribute('aria-expanded', String(open));
      controlsToggle.textContent = open ? 'Hide Controls' : 'Show Controls';
    }
    if (titleEl) {
      titleEl.classList.toggle('is-open', open);
      titleEl.setAttribute('aria-expanded', String(open));
      titleEl.setAttribute('aria-label', open ? 'Hide Controls' : 'Show Controls');
      titleEl.title = open ? 'Hide Controls' : 'Show Controls';
    }
    if (controlsPanel) {
      controlsPanel.setAttribute('aria-hidden', String(!open));
    }
    try {
      localStorage.setItem(CONTROLS_STORAGE_KEY, open ? '1' : '0');
    } catch (err) {}
  }

  function getInitialControlsOpen() {
    try {
      const stored = localStorage.getItem(CONTROLS_STORAGE_KEY);
      if (stored === '1') return true;
      if (stored === '0') return false;
    } catch (err) {}
    return false;
  }

  function getInitialBubbleSoundEnabled() {
    try {
      const stored = localStorage.getItem(BUBBLE_SOUND_STORAGE_KEY);
      if (stored === '1') return true;
      if (stored === '0') return false;
    } catch (err) {}
    return false;
  }

  function getInitialBubbleVolume() {
    try {
      const stored = localStorage.getItem(BUBBLE_VOLUME_STORAGE_KEY);
      const value = Number(stored);
      if (Number.isFinite(value)) return clamp(value, 0, 100);
    } catch (err) {}
    return 100;
  }

  function getBgSetById(id) {
    return BG_SETS.find((set) => set.id === id) || BG_SETS[0];
  }

  function getInitialBgSetId() {
    try {
      const stored = localStorage.getItem(BG_SET_STORAGE_KEY);
      if (stored && BG_SETS.some((set) => set.id === stored)) return stored;
    } catch (err) {}
    return BG_SETS[0].id;
  }

  function updateBgToggleButton() {
    if (!bgToggleBtn) return;
    const activeSet = getBgSetById(currentBgSetId);
    bgToggleBtn.textContent = `BG: ${activeSet.label}`;
  }

  function applyBgSet(id) {
    const activeSet = getBgSetById(id);
    currentBgSetId = activeSet.id;
    rootEl.style.setProperty('--bg-mobile-image', `url("${activeSet.mobile}")`);
    rootEl.style.setProperty('--bg-desktop-image', `url("${activeSet.desktop}")`);
    updateBgToggleButton();
    try {
      localStorage.setItem(BG_SET_STORAGE_KEY, currentBgSetId);
    } catch (err) {}
  }

  function cycleBgSet() {
    const currentIndex = BG_SETS.findIndex((set) => set.id === currentBgSetId);
    const nextSet = BG_SETS[(currentIndex + 1) % BG_SETS.length] || BG_SETS[0];
    applyBgSet(nextSet.id);
  }


  function updateRadioButton() {
    if (!radioToggleBtn) return;

    const isPlaying = !!radioDock && radioDock.classList.contains('radio-playing');
    const isOpen = !!radioDock && radioDock.classList.contains('open');
    const active = isPlaying || isOpen;

    radioToggleBtn.classList.toggle('radio-active', active);
    radioToggleBtn.setAttribute('aria-pressed', String(active));

    if (isOpen) {
      radioToggleBtn.textContent = isPlaying ? 'Hide Radio' : 'Hide Radio';
    } else if (isPlaying) {
      radioToggleBtn.textContent = 'Show Radio';
    } else {
      radioToggleBtn.textContent = '♪ Radio';
    }
  }

  function setRadioOpen(open) {
    if (!radioDock) return;
    radioDock.classList.toggle('open', !!open);
    radioDock.classList.remove('compact');
    radioDock.setAttribute('aria-hidden', String(!open));
    updateRadioButton();
  }

  function hideRadioDial() {
    setRadioOpen(false);
  }

  function setRadioCompact() {
    hideRadioDial();
  }

  function setRadioStatus(text) {
    if (radioStatus) radioStatus.textContent = text;
  }

  function cleanYouTubeId(value) {
    return String(value || '').trim().replace(/[^a-zA-Z0-9_-]/g, '');
  }

  function getInitialRadioUrl() {
    try {
      const stored = localStorage.getItem(RADIO_URL_STORAGE_KEY);
      if (stored) return stored;
    } catch (err) {}
    return DEFAULT_RADIO_URL;
  }

  function saveRadioUrl(url) {
    try {
      localStorage.setItem(RADIO_URL_STORAGE_KEY, url);
    } catch (err) {}
  }

  function buildYouTubeEmbedUrl(rawValue) {
    const input = String(rawValue || '').trim();
    if (!input) return null;

    const buildSearchUrl = (query) => {
      const cleaned = String(query || '').trim();
      if (!cleaned) return null;
      return `https://www.youtube.com/embed?listType=search&list=${encodeURIComponent(cleaned)}&autoplay=1&rel=0&playsinline=1`;
    };

    try {
      const url = new URL(input);
      const host = url.hostname.replace(/^www\./, '').toLowerCase();
      const list = cleanYouTubeId(url.searchParams.get('list'));
      let video = '';

      if (host === 'youtu.be') {
        video = cleanYouTubeId(url.pathname.split('/').filter(Boolean)[0]);
      } else if (host.endsWith('youtube.com') || host.endsWith('youtube-nocookie.com')) {
        if (url.pathname === '/watch') {
          video = cleanYouTubeId(url.searchParams.get('v'));
        } else if (url.pathname.startsWith('/embed/')) {
          video = cleanYouTubeId(url.pathname.split('/').filter(Boolean)[1]);
        } else if (url.pathname.startsWith('/shorts/')) {
          video = cleanYouTubeId(url.pathname.split('/').filter(Boolean)[1]);
        }
      }

      if (list && !video) {
        return `https://www.youtube.com/embed/videoseries?list=${encodeURIComponent(list)}&autoplay=1&rel=0&playsinline=1`;
      }

      if (video) {
        const listPart = list ? `&list=${encodeURIComponent(list)}` : '';
        return `https://www.youtube.com/embed/${encodeURIComponent(video)}?autoplay=1&rel=0&playsinline=1${listPart}`;
      }

      return null;
    } catch (err) {
      const hasWhitespace = /\s/.test(input);
      const bareId = cleanYouTubeId(input);

      if (!hasWhitespace && bareId.length >= 8 && bareId.length <= 64) {
        return `https://www.youtube.com/embed/${encodeURIComponent(bareId)}?autoplay=1&rel=0&playsinline=1`;
      }

      return buildSearchUrl(input);
    }
  }


  function openYouTubeSearch() {
    if (!radioSearchInput) return;

    const query = radioSearchInput.value.trim();

    if (!query) {
      setRadioStatus('search empty');
      setRadioOpen(true);
      return;
    }

    const searchUrl = `https://www.youtube.com/results?search_query=${encodeURIComponent(query)}`;
    const opened = window.open(searchUrl, '_blank', 'noopener,noreferrer');

    if (opened) {
      setRadioStatus('search opened');
    } else {
      setRadioStatus('popup blocked');
    }

    setRadioOpen(true);
  }

  function playRadio(rawValue) {
    if (!radioPlayerFrame || !radioPlayerWrap || !radioDock) return;

    const typedValue = rawValue !== undefined
      ? String(rawValue || '').trim()
      : String((radioUrlInput && radioUrlInput.value) || '').trim();
    const url = typedValue || DEFAULT_RADIO_URL;
    const embedUrl = buildYouTubeEmbedUrl(url);

    if (!embedUrl) {
      setRadioStatus('bad link');
      setRadioOpen(true);
      return;
    }

    if (radioUrlInput && rawValue === undefined) {
      saveRadioUrl(url);
    }
    radioPlayerFrame.src = embedUrl;
    radioPlayerWrap.classList.add('visible');
    radioDock.classList.add('radio-playing');
    setRadioStatus('playing');
    setRadioOpen(true);
  }

  function stopRadio() {
    if (radioPlayerFrame) radioPlayerFrame.src = 'about:blank';
    if (radioPlayerWrap) radioPlayerWrap.classList.remove('visible');
    if (radioDock) radioDock.classList.remove('radio-playing', 'compact');
    setRadioStatus('stopped');
    setRadioOpen(true);
  }

  function resetRadioDefault() {
    if (radioUrlInput) radioUrlInput.value = DEFAULT_RADIO_URL;
    saveRadioUrl(DEFAULT_RADIO_URL);
    playRadio();
  }

  function initRadioDial() {
    if (radioUrlInput) radioUrlInput.value = getInitialRadioUrl();
    if (radioSearchInput) radioSearchInput.value = '';
    setRadioStatus('idle');
    if (radioDock) radioDock.setAttribute('aria-hidden', 'true');
    updateRadioButton();
  }


  const mouse = { x: 0.5, y: 0.5, inside: false };
  const fish = [];
  const particles = [];
  const bubbles = [];
  const diverBubbles = [];
  let crab = null;

  const FISH_SPEED = isMobile ? 3.6 : 4.05;
  const FISH_SIZE_MULTIPLIER = 2;
  const PARTICLE_COUNT = isMobile ? 22 : 55;
  const BUBBLE_COUNT = isMobile ? 40 : 72;
  const DIVER_BUBBLE_COUNT = isMobile ? 24 : 40;
  const TETRA_COUNT = 8;
  const ANGEL_COUNT = 3;
  const DISCUS_COUNT = 1;
  const BARB_COUNT = 3;
  const TETRA_SPRITES = [
    { src: './tetra1.png', facing: 1 },
    { src: './tetra2.png', facing: -1 }
  ];
  const NOMINAL_FRAME_MS = 1000 / 60;

  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  let perfLite = false;
  let frameAvg = 16.7;
  let lowPerfMs = 0;
  let goodPerfMs = 0;
  let frameTick = 0;
  let tankRect = tank.getBoundingClientRect();

  function refreshTankRect() {
    tankRect = tank.getBoundingClientRect();
  }

  function setPerfLite(enabled) {
    const next = !!enabled;
    if (perfLite === next) return;
    perfLite = next;
    rootEl.classList.toggle('perf-lite', perfLite);
  }

  if (typeof ResizeObserver !== 'undefined') {
    const resizeObserver = new ResizeObserver(refreshTankRect);
    resizeObserver.observe(tank);
  } else {
    window.addEventListener('resize', refreshTankRect, { passive:true });
  }

  window.addEventListener('orientationchange', refreshTankRect, { passive:true });
  window.addEventListener('resize', refreshTankRect, { passive:true });

  function rand(a, b) { return a + Math.random() * (b - a); }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  function setPresetBeam(r, g, b) {
    const root = rootEl.style;
    root.setProperty('--beam-rgb', `${r},${g},${b}`);
    root.setProperty('--tank-glow', `rgba(${r},${g},${b},0.20)`);

    if (titleEl) {
      titleEl.style.color = `rgb(${r}, ${g}, ${b})`;
      titleEl.style.borderColor = `rgba(${r}, ${g}, ${b}, 0.52)`;
      titleEl.style.webkitTextStrokeColor = `rgba(${r}, ${g}, ${b}, 0.82)`;
      titleEl.style.background = `linear-gradient(180deg, rgba(${r}, ${g}, ${b}, 0.18), rgba(8,12,18,0.46))`;
      titleEl.style.textShadow = [
        '0 0 2px rgba(255,255,255,0.92)',
        `0 0 8px rgba(${r}, ${g}, ${b}, 0.98)`,
        `0 0 18px rgba(${r}, ${g}, ${b}, 0.68)`,
        `0 0 34px rgba(${r}, ${g}, ${b}, 0.32)`
      ].join(', ');
      titleEl.style.boxShadow = [
        `0 0 14px rgba(${r}, ${g}, ${b}, 0.24)`,
        `0 0 34px rgba(${r}, ${g}, ${b}, 0.14)`,
        `inset 0 0 12px rgba(${r}, ${g}, ${b}, 0.12)`
      ].join(', ');
    }
  }

  function applyCycleSpeed(value = FIXED_CYCLE_SPEED) {
    const n = clamp(Number(value) || 0, 0, 100);
    const root = rootEl.style;
    if (n <= 0) {
      root.setProperty('--wheel-speed', '10s');
      root.setProperty('--wheel-sweep-speed', '7.2s');
      root.setProperty('--wheel-play', 'paused');
      return;
    }
    const duration = 11 - (n / 100) * 9;
    const sweepDuration = duration * 0.72;
    root.setProperty('--wheel-speed', `${duration.toFixed(2)}s`);
    root.setProperty('--wheel-sweep-speed', `${sweepDuration.toFixed(2)}s`);
    root.setProperty('--wheel-play', 'running');
  }

  function applyFixedLightIntensity() {
    const n = 20;
    rootEl.style.setProperty('--light-intensity', (n / 50).toFixed(2));
  }

  function applySwimSpeed(value) {
    const n = clamp(Number(value) || 0, 0, 100);
    swimSpeedScale = n / 100;

  const BUBBLE_AUDIO_LOOP_TRIM = 0.035;

  function getBubbleAudioTargetVolume() {
    const density = clamp(bubbleIntensityScale, 0, 1);
    const base = clamp(0.10 + density * 0.22, 0.06, 0.32);
    return clamp(base * bubbleVolumeScale, 0, 1);
  }

  function getBubbleAudioLoopBounds() {
    if (!bubbleAudioBuffer) return { start: 0, end: 0 };
    const maxTrim = Math.max(0, (bubbleAudioBuffer.duration / 2) - 0.05);
    const trim = clamp(BUBBLE_AUDIO_LOOP_TRIM, 0, maxTrim);
    const start = trim;
    const end = Math.max(start + 0.40, bubbleAudioBuffer.duration - trim);
    return { start, end };
  }

  async function ensureBubbleAudioObject() {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext || null;
    if (!AudioContextClass) return null;

    if (!bubbleAudioContext) {
      bubbleAudioContext = new AudioContextClass();
      bubbleAudioGain = bubbleAudioContext.createGain();
      bubbleAudioGain.gain.value = getBubbleAudioTargetVolume();
      bubbleAudioGain.connect(bubbleAudioContext.destination);
    }

    if (bubbleAudioBuffer) return bubbleAudioContext;

    if (!bubbleAudioLoadPromise) {
      bubbleAudioLoadPromise = (async () => {
        const response = await fetch(BUBBLE_AUDIO_SRC);
        const arrayBuffer = await response.arrayBuffer();
        const decoded = await bubbleAudioContext.decodeAudioData(arrayBuffer.slice(0));
        bubbleAudioBuffer = decoded;
        return decoded;
      })().catch((err) => {
        bubbleAudioLoadPromise = null;
        throw err;
      });
    }

    await bubbleAudioLoadPromise;
    return bubbleAudioContext;
  }

  function stopBubbleAudioSource() {
    if (!bubbleAudioSource) return;
    const source = bubbleAudioSource;
    bubbleAudioSource = null;
    try {
      source.onended = null;
      source.stop(0);
    } catch (err) {}
    try {
      source.disconnect();
    } catch (err) {}
  }

  function startBubbleAudioSource() {
    if (!bubbleAudioContext || !bubbleAudioBuffer || !bubbleAudioGain) return false;
    stopBubbleAudioSource();
    const source = bubbleAudioContext.createBufferSource();
    const bounds = getBubbleAudioLoopBounds();
    source.buffer = bubbleAudioBuffer;
    source.loop = true;
    source.loopStart = bounds.start;
    source.loopEnd = bounds.end;
    source.connect(bubbleAudioGain);
    source.start(0, bounds.start);
    bubbleAudioSource = source;
    return true;
  }

  async function syncBubbleAudioPlayback() {
    try {
      const ctx = await ensureBubbleAudioObject();
      if (!ctx || !bubbleAudioGain) return false;

      bubbleAudioGain.gain.cancelScheduledValues(ctx.currentTime);
      bubbleAudioGain.gain.setTargetAtTime(getBubbleAudioTargetVolume(), ctx.currentTime, 0.02);

      if (!bubbleSoundEnabled || document.hidden) {
        stopBubbleAudioSource();
        if (ctx.state === 'running') {
          try {
            await ctx.suspend();
          } catch (err) {}
        }
        return false;
      }

      if (ctx.state !== 'running') {
        try {
          await ctx.resume();
        } catch (err) {
          return false;
        }
      }

      if (!bubbleAudioSource) {
        startBubbleAudioSource();
      }
      return !!bubbleAudioSource;
    } catch (err) {
      return false;
    }

  function applyBubbleIntensity(value) {

  function hslToRgb(h, s, l) {
    const hue = ((h % 360) + 360) % 360;
    const sat = clamp(s, 0, 100) / 100;
    const light = clamp(l, 0, 100) / 100;

    const c = (1 - Math.abs(2 * light - 1)) * sat;
    const x = c * (1 - Math.abs(((hue / 60) % 2) - 1));
    const m = light - c / 2;

    let r1 = 0, g1 = 0, b1 = 0;

    if (hue < 60) [r1, g1, b1] = [c, x, 0];
    else if (hue < 120) [r1, g1, b1] = [x, c, 0];
    else if (hue < 180) [r1, g1, b1] = [0, c, x];
    else if (hue < 240) [r1, g1, b1] = [0, x, c];
    else if (hue < 300) [r1, g1, b1] = [x, 0, c];
    else [r1, g1, b1] = [c, 0, x];

    return [
      Math.round((r1 + m) * 255),
      Math.round((g1 + m) * 255),
      Math.round((b1 + m) * 255)
    ];
  }

  function applyCyclePalette(timeMs, force = false) {
    const speed = FIXED_CYCLE_SPEED;

    if (speed > 0) {
      const duration = 34 - (speed / 100) * 28;
      cyclePhase = ((timeMs * 0.001) / duration) % 1;
    }

    const bucket = Math.floor(cyclePhase * 180);

    if (!force) {
      const tooSoon = (timeMs - lastCyclePaletteUpdateMs) < CYCLE_PALETTE_INTERVAL_MS;
      if (tooSoon || bucket === lastCyclePaletteBucket) return;
    }

    lastCyclePaletteUpdateMs = timeMs;
    lastCyclePaletteBucket = bucket;

    const hue = (205 + cyclePhase * 360) % 360;
    const [topR, topG, topB] = hslToRgb(hue, 58, 25);
    const [midR, midG, midB] = hslToRgb(hue + 10, 52, 17);
    const [bottomR, bottomG, bottomB] = hslToRgb(hue + 20, 50, 9);
    const [beamR, beamG, beamB] = hslToRgb(hue + 26, 96, 78);
    const [overlayR, overlayG, overlayB] = hslToRgb(hue + 8, 66, 29);

    const r = rootEl.style;
    r.setProperty('--water-top', `rgb(${topR},${topG},${topB})`);
    r.setProperty('--water-mid', `rgb(${midR},${midG},${midB})`);
    r.setProperty('--water-bottom', `rgb(${bottomR},${bottomG},${bottomB})`);
    r.setProperty('--beam-rgb', `${beamR},${beamG},${beamB}`);
    r.setProperty('--beam-alpha-hi', '.25');
    r.setProperty('--beam-alpha-lo', '.02');
    r.setProperty('--shimmer-base', '.40');
    r.setProperty('--mode-sat', '1.14');
    r.setProperty('--mode-bright', '1.03');
    r.setProperty('--mode-contrast', '1.10');
    r.setProperty('--mode-hue', '0deg');
    r.setProperty('--mode-overlay', `linear-gradient(180deg, rgba(${overlayR},${overlayG},${overlayB},0.12), rgba(${bottomR},${bottomG},${bottomB},0.18))`);
    setPresetBeam(beamR, beamG, beamB);
    r.setProperty('--tank-glow', `rgba(${beamR},${beamG},${beamB},0.28)`);
  }

  function chooseTargetForFish(f) {
    if (f.type === 'angel') {
      const cx = f.homeX ?? 0.50;
      const cy = f.homeY ?? 0.18;
      const spreadY = isMobile ? 0.08 : 0.10;
      const currentX = Number.isFinite(f.x) ? f.x : cx;
      const currentDir = f.dir || (Math.random() < 0.5 ? -1 : 1);
      const nearLeftGlass = currentX < 0.18;
      const nearRightGlass = currentX > 0.82;
      let preferredDir = currentDir;

      if (nearLeftGlass) {
        preferredDir = 1;
      } else if (nearRightGlass) {
        preferredDir = -1;
      } else if (Math.random() > 0.76) {
        preferredDir = -currentDir;
      }

      const glideStep = rand(isMobile ? 0.22 : 0.26, isMobile ? 0.42 : 0.50);
      f.targetX = clamp(currentX + preferredDir * glideStep, 0.07, 0.93);

      if (Math.abs(f.targetX - currentX) < 0.15) {
        f.targetX = clamp(currentX + preferredDir * 0.22, 0.07, 0.93);
      }

      f.targetY = clamp(cy + rand(-spreadY, spreadY), 0.05, 0.31);
      f.targetCooldown = rand(1.4, 2.7);
    } else if (f.type === 'tetra') {
      const cx = f.homeX ?? 0.50;
      const cy = f.homeY ?? 0.58;
      const spreadX = isMobile ? 0.24 : 0.31;
      const spreadY = isMobile ? 0.10 : 0.13;
      const dipToBottom = Math.random() < 0.16;

      f.targetX = clamp(cx + rand(-spreadX, spreadX), 0.06, 0.94);

      if (dipToBottom) {
        f.targetY = rand(0.70, 0.82);
      } else {
        f.targetY = clamp(cy + rand(-spreadY, spreadY), 0.36, 0.74);
      }
    } else if (f.type === 'discus') {
      const cruiseBandRoll = Math.random();
      f.targetX = rand(0.06, 0.94);

      if (cruiseBandRoll < 0.24) {
        f.targetY = rand(0.12, 0.34);
      } else if (cruiseBandRoll < 0.68) {
        f.targetY = rand(0.34, 0.68);
      } else {
        f.targetY = rand(0.68, 0.86);
      }
    } else if (f.type === 'barb') {
      const cx = f.homeX ?? 0.50;
      const cy = f.homeY ?? 0.66;
      const spreadX = isMobile ? 0.38 : 0.46;
      const spreadY = isMobile ? 0.14 : 0.18;

      f.targetX = clamp(cx + rand(-spreadX, spreadX), 0.05, 0.95);

      if (bottomRun) {

  function pickState(f, force) {
    if (f.type === 'discus') {
      if (force === 'idle' || force === 'cruise') {
        f.state = force;
      } else {
        // Big boy should still glide and pause, but not fall asleep forever.
        f.state = Math.random() < 0.14 ? 'idle' : 'cruise';
      }

      if (f.state === 'idle') {
        f.stateTimer = rand(1.2, 2.4);
      } else {
        f.state = 'cruise';
        f.stateTimer = rand(4.8, 8.2);
        chooseTargetForFish(f);
      }
      return;
    }

    if (force) {
      f.state = force;
    } else {
      const r = Math.random();
      if (f.type === 'tetra') {
        if (r < 0.18) f.state = 'idle';
        else if (r < 0.92) f.state = 'cruise';
        else if (r < 0.985) f.state = 'turn';
        else f.state = 'dart';
      } else if (f.type === 'angel') {
        if (r < 0.34) f.state = 'idle';
        else if (r < 0.985) f.state = 'cruise';
        else f.state = 'turn';
      } else if (f.type === 'barb') {
        if (r < 0.20) f.state = 'idle';
        else if (r < 0.91) f.state = 'cruise';
        else if (r < 0.985) f.state = 'turn';
        else f.state = 'dart';
      }
    }

    if (f.state === 'idle') {
      f.stateTimer = f.type === 'angel' ? rand(3.4, 7.4) : rand(2.4, 5.8);
    } else if (f.state === 'cruise') {

    } else if (f.state === 'turn') {

      chooseTargetForFish(f);
    } else if (f.state === 'dart') {

    }
  }

    if (!crab) return;

    const zone = crab.maxX - crab.minX;
    const leftBuffer = crab.minX + zone * 0.16;
    const rightBuffer = crab.maxX - zone * 0.16;

    let dir;
    if (crab.x <= leftBuffer) {
      dir = 1;
    } else if (crab.x >= rightBuffer) {
      dir = -1;
    } else if (Math.random() < 0.58) {
      dir = crab.dir || (Math.random() < 0.5 ? -1 : 1);
    } else {
      dir = Math.random() < 0.5 ? -1 : 1;
    }

    const step = rand(zone * 0.05, zone * 0.16);
    crab.targetX = clamp(crab.x + dir * step, crab.minX, crab.maxX);

    if (Math.abs(crab.targetX - crab.x) < zone * 0.03) {
      crab.targetX = clamp(crab.x + dir * zone * 0.08, crab.minX, crab.maxX);
    }

    crab.dir = crab.targetX >= crab.x ? 1 : -1;
    crab.currentSpeed = rand(crab.speedMin, crab.speedMax);
    crab.pause = 0;
    crab.pauseAfterMove = rand(0.35, 1.05);
  }

  function createCrab() {

    for (let i = 0; i < PARTICLE_COUNT; i++) createParticle();
    for (let i = 0; i < BUBBLE_COUNT; i++) createBubble(0.015 + Math.random() * 0.03);
    for (let i = 0; i < DIVER_BUBBLE_COUNT; i++) createDiverBubble();

      applyCyclePalette(performance.now(), true);
    }
  }

  let last = performance.now();

  function animate(now) {
    const rawDt = now - last;
    last = now;

    frameAvg = lerp(frameAvg, rawDt, 0.08);

    if (!isMobile) {
      const underLoad = rawDt > 24 || frameAvg > 22.5;
      if (underLoad) {
        lowPerfMs += rawDt;
        goodPerfMs = 0;
      } else {
        goodPerfMs += rawDt;
        lowPerfMs = Math.max(0, lowPerfMs - rawDt * 0.5);
      }

      if (!perfLite && lowPerfMs > 1200) setPerfLite(true);
      if (perfLite && goodPerfMs > 2400 && frameAvg < 19.5) setPerfLite(false);
    }

    const dt = Math.min(110, rawDt);
    const dtSec = dt / 1000;
    const frameScale = Math.max(0.5, dt / NOMINAL_FRAME_MS);
    const t = now * 0.001;
    frameTick += 1;

    if (currentMode === 'cycle') applyCyclePalette(now);
    const mx = mouse.x;
    const my = mouse.y;

    const updateParticlesThisFrame = true;
    const updateBubblesThisFrame = true;

    if (updateParticlesThisFrame) {
      const particleDt = dt;
      for (const p of particles) {
        if (perfLite && !isMobile && p.perfRank > 0.62) {
          p.el.style.opacity = '0';
          continue;
        }
        p.drift += particleDt * 0.0007;
        p.x += p.vx * particleDt + Math.sin(p.drift * 0.5) * 0.00002;
        p.y += p.vy * particleDt;

        if (p.y < -0.03) {
          p.y = 1.03;
          p.x = Math.random();
        }
        if (p.x < -0.03) p.x = 1.03;
        if (p.x > 1.03) p.x = -0.03;

        p.el.style.opacity = p.a + 0.03 * Math.sin(t + p.drift);
        p.el.style.transform = `translate3d(${p.x * tankRect.width}px, ${p.y * tankRect.height}px, 0)`;
      }
    }

    if (updateBubblesThisFrame) {
      const bubbleDt = dt;
      for (const b of bubbles) {
        const isActive = b.intensityRank <= bubbleIntensityScale;

        if (!isActive) {
          b.y = 1.05 + Math.random() * 0.15;
          b.x = 0.015 + Math.random() * 0.03;
          b.el.style.opacity = '0';
          continue;
        }

        b.wobble += bubbleDt * 0.0016;
        b.y -= b.vy * bubbleDt;
        b.x += b.vx * bubbleDt + Math.sin(b.wobble) * 0.00010;

        if (b.y < -0.06) {
          b.y = 1.05 + Math.random() * 0.15;
          b.x = 0.015 + Math.random() * 0.03;
        }

        const scale = 0.96 + 0.06 * Math.sin(b.wobble * 1.4);
        b.el.style.transform = `translate3d(${b.x * tankRect.width}px, ${b.y * tankRect.height}px, 0) scale(${scale})`;
        b.el.style.opacity = (0.48 + ((1 - b.y) * 0.28)).toFixed(3);
      }

      for (const b of diverBubbles) {
        const isActive = b.intensityRank <= bubbleIntensityScale;

        if (!isActive) {
          b.x = 0.535 + (Math.random() - 0.5) * 0.010;
          b.y = 0.744 + Math.random() * 0.010;
          b.el.style.opacity = '0';
          continue;
        }

        b.wobble += bubbleDt * 0.0011;
        b.y -= b.vy * bubbleDt;
        b.x += b.vx * bubbleDt + Math.sin(b.wobble * 1.15) * 0.00008;

        if (b.y < 0.34) {
          b.x = 0.535 + (Math.random() - 0.5) * 0.010;
          b.y = 0.744 + Math.random() * 0.010;
        }

        const scale = 0.95 + 0.08 * Math.sin(b.wobble * 1.5);
        b.el.style.transform = `translate3d(${b.x * tankRect.width}px, ${b.y * tankRect.height}px, 0) scale(${scale})`;
        b.el.style.opacity = (0.58 + ((1 - b.y) * 0.28)).toFixed(3);
      }
    }

    if (crab) {
      if (crab.pause > 0) {
        crab.pause -= dtSec;
        if (crab.pause <= 0) chooseNewCrabGoal();
      } else {
        const deltaX = crab.targetX - crab.x;
        const stepX = crab.currentSpeed * dt;

        if (Math.abs(deltaX) <= stepX) {
          crab.x = crab.targetX;
          crab.pause = crab.pauseAfterMove || rand(0.35, 1.05);
        } else {
          crab.x += Math.sign(deltaX) * stepX;
        }

        if (Math.abs(deltaX) > 0.0004) {
          crab.dir = deltaX >= 0 ? 1 : -1;
        }
      }

      crab.x = clamp(crab.x, crab.minX, crab.maxX);

      crab.phase += dtSec * (crab.pause > 0 ? 1.5 : 4.2);

      const crawlLift = Math.sin(crab.phase) * (crab.pause > 0 ? 0.00045 : 0.0011);
      const bodyTilt = Math.sin(crab.phase * 0.55) * (crab.pause > 0 ? 0.35 : 0.9);
      const bodyScaleY = 1 + Math.sin(crab.phase * 2) * (crab.pause > 0 ? 0.006 : 0.012);
      crab.el.style.transform =
        `translate3d(${crab.x * tankRect.width}px, ${(crab.baseY + crawlLift) * tankRect.height}px, 0) translate(-50%,-50%) scale(${-crab.dir}, ${bodyScaleY}) rotate(${bodyTilt}deg)`;
    }

    const tetraList = fish.filter(f => f.type === 'tetra');
    let tetraCenterX = 0.5;
    let tetraCenterY = 0.78;

    if (tetraList.length) {
      tetraCenterX = tetraList.reduce((s, f) => s + f.x, 0) / tetraList.length;
      tetraCenterY = tetraList.reduce((s, f) => s + f.y, 0) / tetraList.length;
    }

    for (const f of fish) {
      f.stateTimer -= dtSec;
      f.bobT += dtSec * 2.0;
      f.flipCooldown = Math.max(0, (f.flipCooldown || 0) - dtSec);
      f.targetCooldown = Math.max(0, (f.targetCooldown || 0) - dtSec);
      f.escapeTimer = Math.max(0, (f.escapeTimer || 0) - dtSec);

      if (f.stateTimer <= 0) pickState(f);

      const dxm = f.x - mx;
      const dym = f.y - my;
      const dist2 = dxm * dxm + dym * dym;

      let repelX = 0;
      let repelY = 0;

      if (mouse.inside && dist2 < 0.05) {
        const strength = (0.05 - dist2) * 0.015 * f.shyness;
        repelX = dxm * strength;
        repelY = dym * strength;
        if (f.type !== 'discus' && f.state !== 'dart' && dist2 < 0.012) {
          pickState(f, 'dart');
        }
      }

      if (f.type === 'tetra') {
        const schoolMix = 0.12;
        const schoolTargetX = lerp(f.homeX, tetraCenterX, schoolMix);
        const schoolTargetY = lerp(f.homeY, tetraCenterY, schoolMix);
        f.targetX += (schoolTargetX - f.targetX) * 0.0030 * f.wander;
        f.targetY += (schoolTargetY - f.targetY) * 0.0036 * f.wander;
      }

      const tx = f.targetX - f.x;
      const ty = f.targetY - f.y;
      const dist = Math.hypot(tx, ty) || 0.00001;

      const arrivalDist = f.type === 'angel' ? 0.034 : 0.02;
      if (dist < arrivalDist && (f.state === 'cruise' || f.state === 'turn') && (f.targetCooldown || 0) <= 0) {
        if (Math.random() < (f.type === 'angel' ? 0.06 : 0.02)) {
          pickState(f, 'idle');
        } else {
          chooseTargetForFish(f);
        }
      }

      let desiredSpeed = 0;
      if (f.state === 'idle') desiredSpeed = f.cruiseSpeed * 0.10;
      if (f.state === 'turn') desiredSpeed = f.cruiseSpeed * 0.55;
      if (f.state === 'cruise') desiredSpeed = f.cruiseSpeed;
      if (f.state === 'dart') desiredSpeed = f.dartSpeed;

      const motionBoost = perfLite && !isMobile ? 1.42 : 1;
      const fishSpeedNow = FISH_SPEED * motionBoost * swimSpeedScale;
      let avoidX = repelX;
      let avoidY = repelY;

      // Very soft avoidance so fish don't visually pinwheel in bubble streams
      // or overlap another fish and keep making tiny opposite corrections.
      const bubbleColumns = [
        { x: 0.034, y1: 0.02, y2: 0.96, radius: 0.060, push: 0.000032 },
        { x: 0.535, y1: 0.32, y2: 0.77, radius: 0.072, push: 0.000040 }
      ];

      for (const col of bubbleColumns) {
        if (f.y < col.y1 || f.y > col.y2) continue;
        const dxCol = f.x - col.x;
        const adx = Math.abs(dxCol);
        if (adx < col.radius) {
          const side = dxCol < 0 ? -1 : 1;
          const strength = (1 - adx / col.radius) * col.push * (f.type === 'angel' ? 0.74 : 1);
          avoidX += side * strength;
          avoidY += Math.sin((f.y - col.y1) * 10 + f.schoolPhase) * strength * 0.20;
        }
      }

      const aspect = tankRect.height / Math.max(1, tankRect.width);
      for (const other of fish) {
        if (other === f) continue;
        const ox = f.x - other.x;
        const oyRaw = f.y - other.y;
        const oy = oyRaw * aspect;
        const d2 = ox * ox + oy * oy;
        const minD = (f.type === 'angel' || other.type === 'angel') ? 0.115 : 0.078;
        if (d2 > 0 && d2 < minD * minD) {
          const d = Math.sqrt(d2);
          const push = (1 - d / minD) * (f.type === 'angel' ? 0.000045 : 0.000060);
          avoidX += (ox / d) * push;
          avoidY += (oyRaw / Math.max(0.0001, Math.abs(oyRaw) + Math.abs(ox))) * push * 0.55;
        }
      }

      if ((f.escapeTimer || 0) > 0) {
        avoidX += (f.escapeDir || f.dir || 1) * (f.type === 'angel' ? 0.000050 : 0.000070);
      }

      const desiredVX = (tx / dist) * desiredSpeed * fishSpeedNow + avoidX;
      const desiredVY = (ty / dist) * desiredSpeed * fishSpeedNow + avoidY;

      const accelT = 1 - Math.pow(1 - f.accel, frameScale);
      f.vx = lerp(f.vx, desiredVX, accelT);
      f.vy = lerp(f.vy, desiredVY, accelT);

      if (f.state === 'idle') {
        const idleDrag = Math.pow(0.992, frameScale);
        f.vx *= idleDrag;
        f.vy *= idleDrag;
      } else {
        const dragT = Math.pow(f.drag, frameScale);
        f.vx *= dragT;
        f.vy *= dragT;
      }

      const intentX = Math.abs(tx) > 0.01 ? tx : desiredVX;
      const desiredDir = intentX >= 0 ? 1 : -1;

      if (f.lastDesiredDir && desiredDir !== f.lastDesiredDir && Math.abs(tx) < (f.type === 'angel' ? 0.16 : 0.10)) {
        f.oscillationScore = Math.min(4, (f.oscillationScore || 0) + (f.type === 'angel' ? 0.82 : 0.68));
      } else {
        f.oscillationScore = Math.max(0, (f.oscillationScore || 0) - dtSec * 1.6);
      }
      f.lastDesiredDir = desiredDir;

      if ((f.oscillationScore || 0) > 2.2 && (f.escapeTimer || 0) <= 0) {
        if (f.x < 0.12) {
          f.escapeDir = 1;
        } else if (f.x > 0.88) {
          f.escapeDir = -1;
        } else if (Math.abs(f.x - 0.535) < 0.09 && f.y > 0.38 && f.y < 0.86) {
          f.escapeDir = f.x < 0.535 ? -1 : 1;
        } else if (f.x < 0.10) {
          f.escapeDir = 1;
        } else {
          f.escapeDir = f.dir || (Math.random() < 0.5 ? -1 : 1);
        }

        f.escapeTimer = f.type === 'angel' ? rand(1.2, 1.9) : rand(0.65, 1.15);
        f.targetX = clamp(f.x + f.escapeDir * (f.type === 'angel' ? 0.24 : 0.18), 0.07, 0.93);
        f.targetY = clamp(f.targetY + rand(-0.045, 0.045), f.type === 'angel' ? 0.05 : 0.12, f.type === 'angel' ? 0.31 : 0.88);
        f.targetCooldown = f.type === 'angel' ? rand(1.2, 2.0) : rand(0.6, 1.1);
        f.oscillationScore = 0;
      }

      // Slow down direction decisions so fish don't snap-flip the instant
      // their target shifts. Bigger fish get the gentlest response.
      const dirResponse = f.type === 'angel' ? 0.045 : (f.type === 'discus' ? 0.055 : (f.type === 'barb' ? 0.075 : 0.110));
      const dirResponseT = 1 - Math.pow(1 - dirResponse, frameScale);
      f.turnMomentum = lerp(f.turnMomentum, desiredDir, dirResponseT);

      const previousDir = f.dir;
      const turnThreshold = f.type === 'discus' ? 0.16 : (f.type === 'angel' ? 0.30 : (f.type === 'barb' ? 0.18 : 0.12));
      const activeTurnDuration = f.turnDuration ?? 520;
      const turnStillPlaying = (f.turnAge ?? 999) < activeTurnDuration * 0.82;
      const wantsEdgeTurn =
        (f.x < 0.085 && desiredDir > 0) ||
        (f.x > 0.915 && desiredDir < 0) ||
        ((f.escapeTimer || 0) > 0 && desiredDir === (f.escapeDir || desiredDir));
      const canFlip = (f.flipCooldown || 0) <= 0 || wantsEdgeTurn;

      if (!turnStillPlaying && canFlip) {
        if (f.turnMomentum > turnThreshold) f.dir = 1;
        if (f.turnMomentum < -turnThreshold) f.dir = -1;
      }

      // Give direction changes a real slow pivot instead of a hard mirror flip.
      // The fish holds the old facing longer, compresses, flips near the middle,
      // then eases back out.
      if (f.dir !== previousDir) {
        const turnBrake = f.type === 'discus' ? 0.16 : (f.type === 'angel' ? 0.18 : (f.type === 'barb' ? 0.28 : 0.36));
        f.vx *= turnBrake;
        f.flipCooldown = f.type === 'discus' ? rand(1.8, 2.8) : (f.type === 'angel' ? rand(3.0, 4.8) : (f.type === 'barb' ? rand(1.2, 2.0) : rand(0.65, 1.15)));
        f.targetCooldown = Math.max(f.targetCooldown || 0, f.type === 'angel' ? 1.5 : 0.6);
        f.turnFromDir = previousDir;
        f.turnToDir = f.dir;
        f.turnAge = 0;
        f.turnDuration = f.type === 'discus' ? 1250 : (f.type === 'angel' ? 1320 : (f.type === 'barb' ? 880 : 680));
      }

      if (f.dir === 1 && f.vx < 0) f.vx *= 0.35;
      if (f.dir === -1 && f.vx > 0) f.vx *= 0.35;

      f.x += f.vx * dt;
      f.y += f.vy * dt;

      if (f.type === 'angel') {
        f.x = clamp(f.x, 0.05, 0.95);
        f.y = clamp(f.y, 0.04, 0.32);
      } else if (f.type === 'tetra') {
        f.x = clamp(f.x, 0.06, 0.94);
        f.y = clamp(f.y, 0.34, 0.82);
      } else if (f.type === 'discus') {
        f.x = clamp(f.x, 0.06, 0.94);
        f.y = clamp(f.y, 0.12, 0.86);
      } else if (f.type === 'barb') {
        f.x = clamp(f.x, 0.05, 0.95);
        f.y = clamp(f.y, 0.50, 0.90);
      }

      const displayVX = Math.max(Math.abs(f.vx), Math.abs(desiredVX) * 0.65, 0.00001) * f.dir;
      const moveAngle = Math.atan2(f.vy, displayVX);
      const turnEaseT = 1 - Math.pow(1 - f.turnEase, frameScale);
      f.angle = lerp(f.angle, moveAngle, turnEaseT);

      const speedMag = Math.hypot(f.vx, f.vy);
      f.turnAge = Math.min((f.turnAge ?? 999) + dt, f.turnDuration ?? 420);

      const tailBoost =
        f.state === 'dart' ? 2.0 :
        f.state === 'cruise' ? 1.0 :
        f.state === 'turn' ? 0.7 : 0.35;

      const bodyBob =
        f.state === 'idle'
          ? Math.sin(f.bobT * 1.5 + f.schoolPhase) * 0.0012 * f.idleBob
          : Math.sin(f.bobT * 1.8 + f.schoolPhase) * 0.0008 * f.idleBob;

      const extraSchoolY = f.type === 'tetra'
        ? Math.sin(t * 0.7 + f.schoolPhase) * 0.0014
        : 0;

      const drawY = f.y + bodyBob + extraSchoolY + f.depthOffset;
      const rotDeg = (f.angle * 180 / Math.PI) * (f.type === 'discus' ? 0.12 : (f.type === 'barb' ? 0.15 : 0.18));
      const tailPhase = Math.sin(t * 10 * tailBoost + f.schoolPhase * 2);
      const tailDeg = f.type === 'discus'
        ? tailPhase * clamp(speedMag * 650, 0, 0.20)
        : tailPhase * (speedMag * (f.type === 'barb' ? 7600 : 9000));
      const finalRot = rotDeg + clamp(tailDeg, f.type === 'discus' ? -0.20 : (f.type === 'barb' ? -3.5 : -4.5), f.type === 'discus' ? 0.20 : (f.type === 'barb' ? 3.5 : 4.5));

      const spriteFacing = f.nativeFacing ?? ((f.type === 'angel' || f.type === 'discus') ? -1 : 1);
      const baseOpacity = f.type === 'tetra' ? 0.96 : (f.type === 'discus' ? 0.98 : (f.type === 'barb' ? 0.97 : 1));
      const drawScale = f.scale * FISH_SIZE_MULTIPLIER;

      // Softer, slower turn illusion, without the paper-thin cutout look:
      // compress, linger through the hidden midpoint, then expand.
      const turnDuration = f.turnDuration ?? 520;
      const isTurningVisual = (f.turnAge ?? turnDuration) < turnDuration;
      let visualDir = f.dir;
      let turnPulse = 0;

      if (isTurningVisual) {
        const turnP = clamp(f.turnAge / turnDuration, 0, 1);
        const easedTurnP = turnP < 0.5
          ? 2 * turnP * turnP
          : 1 - Math.pow(-2 * turnP + 2, 2) / 2;

        // Hold the old facing a touch longer so the actual flip is hidden
        // inside the compressed part of the turn instead of popping early.
        const flipPoint = f.type === 'discus' ? 0.62 : (f.type === 'angel' ? 0.60 : 0.56);
        visualDir = easedTurnP < flipPoint ? (f.turnFromDir ?? f.dir) : (f.turnToDir ?? f.dir);
        turnPulse = Math.sin(Math.PI * easedTurnP);
      }

      f.visualDir = visualDir;

      // Depth illusion: the fish can flip/compress/rotate, but its shadow
      // stays as a separate flat oval below it. This avoids the fake-looking
      // spinning shadow during turns.
      const turnDim = 1 - turnPulse * (f.type === 'discus' ? 0.07 : (f.type === 'angel' ? 0.06 : 0.09));
      f.el.style.opacity = (baseOpacity * turnDim).toFixed(3);

      const depthNorm = clamp((f.y - 0.08) / 0.82, 0, 1);
      const shadowBase =
        f.type === 'tetra' ? 0.245 :
        f.type === 'discus' ? 0.350 :
        f.type === 'barb' ? 0.320 :
        0.360;
      const shadowOpacity = clamp(shadowBase * (0.86 + depthNorm * 0.88), 0, 0.66);
      const shadowBlur =
        f.type === 'tetra' ? 3.2 :
        f.type === 'discus' ? 5.4 :
        f.type === 'barb' ? 4.0 :
        5.8;
      const shadowScaleX =
        f.type === 'angel' ? 1.05 + depthNorm * 0.44 :
        f.type === 'discus' ? 1.12 + depthNorm * 0.38 :
        1.15 + depthNorm * 0.45;
      const shadowScaleY =
        f.type === 'angel' ? 0.88 :
        f.type === 'discus' ? 0.92 :
        0.82;
      const shadowOffsetPx =
        f.type === 'angel' ? 28 :
        f.type === 'discus' ? 18 :
        f.type === 'barb' ? 16 :
        13;

      if (f.shadowEl) {
        const shadowX = f.x * tankRect.width;
        const shadowYPx = (drawY * tankRect.height) + (shadowOffsetPx * drawScale);
        f.shadowEl.style.opacity = shadowOpacity.toFixed(3);
        f.shadowEl.style.filter = `blur(${shadowBlur.toFixed(1)}px)`;
        f.shadowEl.style.transform =
          `translate3d(${shadowX}px, ${shadowYPx}px, 0) translate(-50%,-50%) scale(${(drawScale * shadowScaleX).toFixed(3)}, ${(drawScale * shadowScaleY).toFixed(3)})`;
      }

      if (f.type === 'discus') {
        const speedMood = f.state === 'dart' ? 1.45 : (f.state === 'cruise' ? 1.0 : 0.55);
        const movementPulse = clamp(speedMag * 7600, 0, 1.05);
        const finSpeedMs = Math.round(1900 - (speedMood * 210) - (movementPulse * 230));
        const targetFinWag = clamp(0.92 + speedMood * 0.28 + movementPulse * 0.38 + turnPulse * 0.22, 0.92, 1.62);

        // Slow and smooth the CSS variable changes. Changing animation speed every
        // frame can make the tail look nervous even when the shape is right.
        const targetTailSpeedMs = clamp(finSpeedMs * 0.92, 1080, 1780);
        const tailSmoothT = 1 - Math.pow(0.94, frameScale);
        const wagSmoothT = 1 - Math.pow(0.90, frameScale);
        f.tailSpeedMs = Number.isFinite(f.tailSpeedMs) ? lerp(f.tailSpeedMs, targetTailSpeedMs, tailSmoothT) : targetTailSpeedMs;
        f.tailWag = Number.isFinite(f.tailWag) ? lerp(f.tailWag, targetFinWag, wagSmoothT) : targetFinWag;

        const finWag = f.tailWag;
        const tailSpeedMs = Math.round(f.tailSpeedMs);
        const tailX = clamp(0.32 + finWag * 0.125 + movementPulse * 0.035, 0.34, 0.58);
        const tailSkew = clamp(0.96 + finWag * 0.56 + movementPulse * 0.14, 1.18, 2.08);
        const tailRot = clamp(0.38 + finWag * 0.24 + turnPulse * 0.07, 0.48, 0.80);
        const tailScaleA = clamp(0.966 - finWag * 0.035, 0.907, 0.935);
        const tailScaleB = clamp(1.034 + finWag * 0.039, 1.066, 1.100);
        f.el.style.setProperty('--fin-speed-top', `${finSpeedMs}ms`);
        f.el.style.setProperty('--fin-speed-bottom', `${Math.round(finSpeedMs * 1.08)}ms`);
        f.el.style.setProperty('--fin-speed-tail', `${tailSpeedMs}ms`);
        f.el.style.setProperty('--fin-speed-pec', `${Math.round(finSpeedMs * 0.62)}ms`);
        f.el.style.setProperty('--fin-wag', finWag.toFixed(2));
        f.el.style.setProperty('--tail-x-a', `${tailX.toFixed(3)}%`);
        f.el.style.setProperty('--tail-x-b', `${(-tailX).toFixed(3)}%`);
        f.el.style.setProperty('--tail-scale-a', tailScaleA.toFixed(3));
        f.el.style.setProperty('--tail-scale-b', tailScaleB.toFixed(3));
        f.el.style.setProperty('--tail-skew-a', `${(-tailSkew).toFixed(2)}deg`);
        f.el.style.setProperty('--tail-skew-b', `${tailSkew.toFixed(2)}deg`);
        f.el.style.setProperty('--tail-rot-a', `${(-tailRot).toFixed(2)}deg`);
        f.el.style.setProperty('--tail-rot-b', `${tailRot.toFixed(2)}deg`);
      }

      if (f.tailAnim === 'angel' || f.tailAnim === 'barb') {
        const tailKind = f.tailAnim;
        const speedMood = f.state === 'dart' ? 1.35 : (f.state === 'cruise' ? 1.0 : 0.52);
        const movementPulse = clamp(speedMag * (tailKind === 'barb' ? 11800 : 8600), 0, 1.15);
        const targetTailSpeedMs = tailKind === 'angel'
          ? clamp(1820 - (speedMood * 140) - (movementPulse * 260), 1320, 1880)
          : clamp(1260 - (speedMood * 150) - (movementPulse * 245), 880, 1320);
        const targetTailWag = tailKind === 'angel'
          ? clamp(0.62 + speedMood * 0.15 + movementPulse * 0.32 + turnPulse * 0.10, 0.66, 1.18)
          : clamp(0.82 + speedMood * 0.18 + movementPulse * 0.42 + turnPulse * 0.14, 0.86, 1.48);

        const tailSmoothT = 1 - Math.pow(tailKind === 'angel' ? 0.955 : 0.935, frameScale);
        const wagSmoothT = 1 - Math.pow(tailKind === 'angel' ? 0.925 : 0.905, frameScale);
        f.tailSpeedMs = Number.isFinite(f.tailSpeedMs) ? lerp(f.tailSpeedMs, targetTailSpeedMs, tailSmoothT) : targetTailSpeedMs;
        f.tailWag = Number.isFinite(f.tailWag) ? lerp(f.tailWag, targetTailWag, wagSmoothT) : targetTailWag;

        const finWag = f.tailWag;
        const tailSpeedMs = Math.round(f.tailSpeedMs);
        const tailX = tailKind === 'angel'
          ? clamp(0.16 + finWag * 0.070 + movementPulse * 0.030, 0.18, 0.32)
          : clamp(0.24 + finWag * 0.110 + movementPulse * 0.040, 0.28, 0.48);
        const tailSkew = tailKind === 'angel'
          ? clamp(0.48 + finWag * 0.52 + movementPulse * 0.12, 0.70, 1.22)
          : clamp(0.72 + finWag * 0.74 + movementPulse * 0.18, 1.00, 1.92);
        const tailRot = tailKind === 'angel'
          ? clamp(0.22 + finWag * 0.20 + turnPulse * 0.04, 0.28, 0.48)
          : clamp(0.34 + finWag * 0.26 + turnPulse * 0.06, 0.48, 0.78);
        const tailScaleA = tailKind === 'angel'
          ? clamp(0.986 - finWag * 0.018, 0.964, 0.976)
          : clamp(0.978 - finWag * 0.030, 0.932, 0.954);
        const tailScaleB = tailKind === 'angel'
          ? clamp(1.014 + finWag * 0.020, 1.026, 1.040)
          : clamp(1.022 + finWag * 0.034, 1.052, 1.076);

        f.el.style.setProperty('--tail-speed', `${tailSpeedMs}ms`);
        f.el.style.setProperty('--tail-x-a', `${tailX.toFixed(3)}%`);
        f.el.style.setProperty('--tail-x-b', `${(-tailX).toFixed(3)}%`);
        f.el.style.setProperty('--tail-scale-a', tailScaleA.toFixed(3));
        f.el.style.setProperty('--tail-scale-b', tailScaleB.toFixed(3));
        f.el.style.setProperty('--tail-skew-a', `${(-tailSkew).toFixed(2)}deg`);
        f.el.style.setProperty('--tail-skew-b', `${tailSkew.toFixed(2)}deg`);
        f.el.style.setProperty('--tail-rot-a', `${(-tailRot).toFixed(2)}deg`);
        f.el.style.setProperty('--tail-rot-b', `${tailRot.toFixed(2)}deg`);
      }

      const minTurnWidth = f.type === 'discus' ? 0.78 : (f.type === 'angel' ? 0.74 : (f.type === 'barb' ? 0.70 : 0.68));
      const widthMultiplier = 1 - turnPulse * (1 - minTurnWidth);
      const turnLeanDeg = turnPulse * f.dir * (f.type === 'discus' ? 1.4 : (f.type === 'angel' ? 1.8 : (f.type === 'barb' ? 2.5 : 2.8)));
      const visualScaleX = spriteFacing * visualDir * drawScale * widthMultiplier;
      const visualScaleY = drawScale * (1 + turnPulse * 0.010);

      f.el.style.transform =
        `translate3d(${f.x * tankRect.width}px, ${drawY * tankRect.height}px, 0) translate(-50%,-50%) scale(${visualScaleX}, ${visualScaleY}) rotate(${finalRot + turnLeanDeg}deg)`;
    }

    scheduleBubbleAudio(now);
    requestAnimationFrame(animate);
  }

  function updatePointerFromClient(clientX, clientY) {
    const r = tank.getBoundingClientRect();
    mouse.x = clamp((clientX - r.left) / r.width, 0, 1);
    mouse.y = clamp((clientY - r.top) / r.height, 0, 1);
    mouse.inside = true;
  }

  tank.addEventListener('mousemove', (e) => {
    updatePointerFromClient(e.clientX, e.clientY);
  });

  tank.addEventListener('mouseleave', () => {
    mouse.inside = false;
    mouse.x = 0.5;
    mouse.y = 0.5;
  });

  tank.addEventListener('touchstart', (e) => {
    const touch = e.touches[0];
    if (touch) updatePointerFromClient(touch.clientX, touch.clientY);
  }, { passive:true });

  tank.addEventListener('touchmove', (e) => {
    const touch = e.touches[0];
    if (touch) updatePointerFromClient(touch.clientX, touch.clientY);
  }, { passive:true });

  tank.addEventListener('touchend', () => {
    mouse.inside = false;
    mouse.x = 0.5;
    mouse.y = 0.5;
  }, { passive:true });

  if (lightModeBtn) {
    lightModeBtn.addEventListener('click', () => {
      const currentIndex = LIGHT_MODE_ORDER.indexOf(currentMode);
      const nextIndex = currentIndex === -1 ? 0 : (currentIndex + 1) % LIGHT_MODE_ORDER.length;
      setMode(LIGHT_MODE_ORDER[nextIndex]);
    });
  }

  swimSpeed.addEventListener('input', (e) => {
    applySwimSpeed(e.target.value);
  });

  bubbleIntensity.addEventListener('input', (e) => {
    applyBubbleIntensity(e.target.value);
  });

  bubbleVolume.addEventListener('input', (e) => {
    applyBubbleVolume(e.target.value);
  });

  if (bubbleVolume) bubbleVolume.value = String(getInitialBubbleVolume());

  setPerfLite(prefersReducedMotion);
  setControlsOpen(getInitialControlsOpen());
  applyBgSet(getInitialBgSetId());
  applyBubbleVolume(bubbleVolume ? bubbleVolume.value : 100);
  setBubbleSoundEnabled(getInitialBubbleSoundEnabled());
  initRadioDial();
  syncFullscreenUI();
  seedScene();
  refreshTankRect();
  setMode('day');
  applyFixedLightIntensity();
  applyCycleSpeed();
  applySwimSpeed(swimSpeed.value);
  applyBubbleIntensity(bubbleIntensity.value);
  applyBubbleVolume(bubbleVolume ? bubbleVolume.value : 100);
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
